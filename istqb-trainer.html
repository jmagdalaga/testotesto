<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB CTFL v4.0.1 — Complete Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10;--surface:#111318;--surface2:#181c24;--border:#252a36;
  --accent:#4af0a8;--accent2:#38bdf8;--accent3:#f59e0b;--warn:#f87171;
  --purple:#a78bfa;--text:#e8eaf0;--muted:#7a8099;
  --card-glow:0 0 40px rgba(74,240,168,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.badge{background:var(--accent);color:#0a0c10;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;letter-spacing:.1em;padding:3px 9px;border-radius:4px;text-transform:uppercase;white-space:nowrap;}
header h1{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.progress-text{font-size:12px;color:var(--muted);}
.progress-mini{width:80px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-mini-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 57px);}

/* SIDEBAR */
aside{background:var(--surface);border-right:1px solid var(--border);position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;display:flex;flex-direction:column;}
.chapter-group{border-bottom:1px solid var(--border);}
.chapter-header{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface);transition:background .2s;user-select:none;}
.chapter-header:hover{background:var(--surface2);}
.chapter-header.open{color:var(--text);}
.chapter-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .2s;}
.chapter-header.open .chapter-dot{background:var(--accent);}
.chapter-items{display:none;}
.chapter-items.open{display:block;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px 8px 32px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:13px;color:var(--muted);}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{border-left-color:var(--accent);background:rgba(74,240,168,0.06);color:var(--accent);font-weight:500;}
.nav-item .num{font-size:10px;background:var(--surface2);border-radius:3px;padding:1px 5px;font-family:'Syne',sans-serif;font-weight:700;min-width:30px;text-align:center;flex-shrink:0;}
.nav-item.active .num{background:rgba(74,240,168,0.15);color:var(--accent);}

/* MAIN */
main{padding:36px 44px;max-width:900px;}
.section{display:none;animation:fadeIn .3s ease;}
.section.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* TYPOGRAPHY */
.section-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;font-family:'Syne',sans-serif;margin-bottom:6px;}
h2{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--text);line-height:1.2;margin-bottom:8px;}
h3{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--text);margin-bottom:10px;}
.intro-text{font-size:15px;color:var(--muted);margin-bottom:28px;max-width:640px;}
p{font-size:14px;color:var(--muted);margin-bottom:8px;}
p:last-child{margin-bottom:0;}
strong{color:var(--text);font-weight:600;}

/* ANALOGY */
.analogy{background:linear-gradient(135deg,rgba(74,240,168,.08),rgba(56,189,248,.06));border:1px solid rgba(74,240,168,.2);border-radius:12px;padding:18px 22px;margin-bottom:22px;position:relative;overflow:hidden;}
.analogy::before{content:'💡';position:absolute;right:18px;top:14px;font-size:26px;opacity:.35;}
.analogy-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:5px;}

/* CARDS */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.cards-grid.three{grid-template-columns:1fr 1fr 1fr;}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;transition:border-color .2s,box-shadow .2s;}
.card:hover{border-color:rgba(74,240,168,.3);box-shadow:var(--card-glow);}
.card-icon{font-size:20px;margin-bottom:7px;}
.card h4{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--text);margin-bottom:5px;}
.card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0;}

/* INFO BLOCK */
.info-block{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:18px;}
.info-block.blue{border-color:rgba(56,189,248,.25);background:rgba(56,189,248,.05);}
.info-block.yellow{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.05);}
.info-block.red{border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.05);}
.info-block.purple{border-color:rgba(167,139,250,.25);background:rgba(167,139,250,.05);}

/* FLOW */
.flow{display:flex;flex-direction:column;gap:0;margin-bottom:24px;}
.flow-step{display:flex;align-items:flex-start;gap:14px;position:relative;}
.flow-step::before{content:'';position:absolute;left:17px;top:36px;width:2px;height:calc(100% - 6px);background:linear-gradient(to bottom,var(--accent2),transparent);}
.flow-step:last-child::before{display:none;}
.flow-dot{width:36px;height:36px;border-radius:50%;background:rgba(56,189,248,.12);border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:4px;}
.flow-content{padding-bottom:20px;flex:1;}
.flow-content h4{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--accent2);margin-bottom:3px;}
.flow-content p{font-size:13px;color:var(--muted);margin:0;}

/* PRINCIPLE */
.principle{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.principle:last-child{border-bottom:none;}
.principle-num{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--accent);min-width:32px;line-height:1;padding-top:2px;}
.principle-body h4{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px;}
.principle-body p{font-size:13px;color:var(--muted);margin:0 0 4px;}
.real-world{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent3);background:rgba(245,158,11,.1);border-radius:4px;padding:2px 7px;}

/* TABLE */
.compare{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13px;}
.compare th{background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.compare td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;font-size:13px;}
.compare tr:last-child td{border-bottom:none;}
.compare tr:hover td{background:rgba(255,255,255,.02);}
.tag-g{color:var(--accent);font-weight:600;}
.tag-b{color:var(--accent2);font-weight:600;}
.tag-y{color:var(--accent3);font-weight:600;}
.tag-r{color:var(--warn);font-weight:600;}
.tag-p{color:var(--purple);font-weight:600;}

/* TERM LIST */
.term-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.term{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);}
.term-name{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--accent3);min-width:150px;flex-shrink:0;}
.term-def{font-size:12px;color:var(--muted);}

/* QUIZ */
.quiz-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;}
.quiz-q{font-size:14px;font-weight:500;color:var(--text);margin-bottom:14px;line-height:1.6;}
.quiz-options{display:flex;flex-direction:column;gap:7px;}
.quiz-opt{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 13px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;text-align:left;font-family:'DM Sans',sans-serif;}
.quiz-opt:hover:not(:disabled){border-color:var(--accent2);color:var(--text);}
.quiz-opt.correct{border-color:var(--accent);background:rgba(74,240,168,.1);color:var(--accent);}
.quiz-opt.wrong{border-color:var(--warn);background:rgba(248,113,113,.1);color:var(--warn);}
.quiz-feedback{display:none;margin-top:10px;padding:10px 13px;border-radius:7px;font-size:12px;line-height:1.6;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:rgba(74,240,168,.08);color:var(--accent);border:1px solid rgba(74,240,168,.2);}
.quiz-feedback.nope{background:rgba(248,113,113,.08);color:var(--warn);border:1px solid rgba(248,113,113,.2);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:26px 0;}

/* CHAPTER INTRO BANNER */
.chapter-banner{background:linear-gradient(135deg,rgba(74,240,168,.1),rgba(56,189,248,.08));border:1px solid rgba(74,240,168,.2);border-radius:14px;padding:24px 28px;margin-bottom:28px;}
.chapter-banner .ch-num{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.chapter-banner h2{font-size:24px;margin-bottom:8px;}
.chapter-banner p{font-size:14px;color:var(--muted);}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* SCORE BANNER */
.score-banner{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;}
.score-num{font-family:'Syne',sans-serif;font-weight:800;font-size:42px;color:var(--accent);}
.score-label{font-size:14px;color:var(--muted);}
.score-label strong{display:block;font-size:18px;color:var(--text);}

@media(max-width:768px){.layout{grid-template-columns:1fr;}aside{display:none;}main{padding:20px 16px;}.cards-grid,.cards-grid.three{grid-template-columns:1fr;}h2{font-size:22px;}}
</style>
</head>
<body>

<header>
  <span class="badge">ISTQB</span>
  <h1>CTFL v4.0.1 — Complete Foundation Trainer</h1>
  <div class="header-right">
    <span class="progress-text" id="progressText">0% complete</span>
    <div class="progress-mini"><div class="progress-mini-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<div class="layout">
<aside id="sidebar"></aside>
<main id="main"></main>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const chapters = [
{
  id:'ch1', title:'Ch 1 · Fundamentals of Testing', color:'#4af0a8',
  sections:[
    { id:'1_1', num:'1.1', title:'What is Testing?', content:`
<div class="section-tag">Section 1.1</div>
<h2>What is Software Testing?</h2>
<p class="intro-text">Let's start from scratch. Imagine you're a chef — you taste the dish before serving it to a customer. That's testing in a nutshell. In software, we "taste" the product before it reaches users.</p>
<div class="analogy"><div class="analogy-label">Real-World Analogy</div><p>Think of software testing like a <strong>car inspection before buying</strong>. You don't just look at the outside — you check the engine, test the brakes, take it for a test drive, and make sure it fits your lifestyle. That's verification (works as promised) AND validation (meets your actual needs).</p></div>
<div class="info-block"><h3>The Simple Definition</h3><p>Software testing is a <strong>set of activities to discover defects and evaluate the quality</strong> of software. The software being tested is called the <strong>test object</strong>.</p><p>🚫 <strong>Misconception #1:</strong> Testing = just clicking around and running the app. <em>Wrong!</em> It includes planning, designing test cases, reviewing documents, and analyzing results.</p><p>🚫 <strong>Misconception #2:</strong> Testing only checks requirements are met (verification). <em>Nope!</em> It also checks if the software solves real user problems (validation).</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">🔍</div><h4>Verification</h4><p>"Did we build the product <em>right</em>?" — Does it match the specs?</p></div><div class="card"><div class="card-icon">✅</div><h4>Validation</h4><p>"Did we build the <em>right</em> product?" — Does it solve the real user problem?</p></div><div class="card"><div class="card-icon">⚡</div><h4>Dynamic Testing</h4><p>You <em>run</em> the software to test it. Like pressing a button to see if it works.</p></div><div class="card"><div class="card-icon">📄</div><h4>Static Testing</h4><p>Test <em>without</em> running software — reviewing documents, code, or specs for issues.</p></div></div>
<div class="info-block blue"><h3>🧠 Easy Memory Trick</h3><p><strong>Static</strong> = reading a recipe and checking for mistakes (no cooking needed).<br><strong>Dynamic</strong> = actually cooking and tasting the dish.</p></div>`
    },
    { id:'1_2', num:'1.1.1', title:'Test Objectives', content:`
<div class="section-tag">Section 1.1.1</div>
<h2>Test Objectives</h2>
<p class="intro-text">Why do we test? It's not just "to find bugs." There are many goals depending on the situation.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of objectives like <strong>reasons a doctor runs tests</strong>. Sometimes to find disease, sometimes to confirm a treatment worked, sometimes to give peace of mind. Same patient, different goals each visit.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">🔎</div><h4>Find Defects</h4><p>Cause failures intentionally to uncover hidden bugs.</p></div><div class="card"><div class="card-icon">📊</div><h4>Assess Quality</h4><p>Measure how good or risky the software is at any point.</p></div><div class="card"><div class="card-icon">✅</div><h4>Verify Requirements</h4><p>Confirm all specified features work as written.</p></div><div class="card"><div class="card-icon">⚖️</div><h4>Meet Legal Needs</h4><p>Prove compliance with regulations, contracts, standards.</p></div><div class="card"><div class="card-icon">🛡️</div><h4>Reduce Risk</h4><p>Lower the chance of failures in real-world use.</p></div><div class="card"><div class="card-icon">💬</div><h4>Inform Decisions</h4><p>Give stakeholders data to decide: "Is this ready to ship?"</p></div><div class="card"><div class="card-icon">💪</div><h4>Build Confidence</h4><p>Give team and users confidence the product is reliable.</p></div><div class="card"><div class="card-icon">📋</div><h4>Evaluate Work Products</h4><p>Review requirements, designs, user stories — not just code.</p></div></div>
<div class="info-block yellow"><h3>📌 Exam Tip</h3><p>Objectives are <strong>context-dependent</strong>. A startup beta app has different objectives than hospital medical software. Always match your objectives to the real situation.</p></div>`
    },
    { id:'1_3', num:'1.1.2', title:'Testing & Debugging', content:`
<div class="section-tag">Section 1.1.2</div>
<h2>Testing vs. Debugging</h2>
<p class="intro-text">These two are often confused. They're related but completely different activities.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p><strong>Testing</strong> = a doctor running lab tests to detect a disease.<br><strong>Debugging</strong> = the surgeon removing the tumor. A doctor doesn't have to be the surgeon — and vice versa.</p></div>
<table class="compare"><thead><tr><th>Testing</th><th>Debugging</th></tr></thead><tbody><tr><td>Done by <span class="tag-g">Testers</span></td><td>Done by <span class="tag-b">Developers</span></td></tr><tr><td>Finds that something is wrong (the <em>failure</em>)</td><td>Finds <em>why</em> it's wrong and fixes it</td></tr><tr><td>A <strong>testing</strong> activity</td><td>A <strong>non-testing</strong> activity</td></tr><tr><td>Shows symptoms</td><td>Diagnoses root cause, applies fix</td></tr></tbody></table>
<div class="flow"><div class="flow-step"><div class="flow-dot">🧪</div><div class="flow-content"><h4>1. Tester executes test → Failure observed</h4><p>Software behaves unexpectedly. Something is wrong.</p></div></div><div class="flow-step"><div class="flow-dot">🔬</div><div class="flow-content"><h4>2. Developer Debugs → Finds & Fixes the Defect</h4><p>Reproduces, diagnoses root cause, fixes the code.</p></div></div><div class="flow-step"><div class="flow-dot">✅</div><div class="flow-content"><h4>3. Confirmation Testing</h4><p>Tester re-runs the test to confirm the fix worked. Ideally the <em>same tester</em>.</p></div></div><div class="flow-step"><div class="flow-dot">🔄</div><div class="flow-content"><h4>4. Regression Testing</h4><p>Tester checks that the fix didn't break something else.</p></div></div></div>
<div class="info-block"><h3>📌 Static Testing is Different</h3><p>Static testing directly finds defects in documents/code — no failure occurs. So debugging after static testing means just removing the defect. No reproduction needed.</p></div>`
    },
    { id:'1_4', num:'1.2', title:'Why Testing is Necessary', content:`
<div class="section-tag">Section 1.2</div>
<h2>Why is Testing Necessary?</h2>
<p class="intro-text">Some people think testing is optional or a waste of time. Here's why they're dangerously wrong.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Would you board a plane never tested? Take medicine that skipped clinical trials? Software failures have cost lives, billions of dollars, and reputations. The Ariane 5 rocket exploded due to a software bug. A faulty medical device gave wrong radiation doses. Testing saves lives.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">💰</div><h4>Cost-Effective Defect Detection</h4><p>Finding a bug in requirements costs ~$1 to fix. Finding it after release can cost ~$100+. Fix early.</p></div><div class="card"><div class="card-icon">📈</div><h4>Project Decision Making</h4><p>Test results help managers decide: "Is this good enough to release?" — based on real data, not guesses.</p></div><div class="card"><div class="card-icon">👥</div><h4>Represents the User</h4><p>Testers speak for users who can't be in the room. They ensure user needs are considered during development.</p></div><div class="card"><div class="card-icon">📜</div><h4>Legal & Regulatory Compliance</h4><p>Banking, healthcare, aviation — legally require testing before deployment. No test, no go-live.</p></div></div>`
    },
    { id:'1_5', num:'1.2.2', title:'Testing vs. QA', content:`
<div class="section-tag">Section 1.2.2</div>
<h2>Testing vs. Quality Assurance (QA)</h2>
<p class="intro-text">Even senior engineers mix these up. Here's the clear distinction the ISTQB expects you to know.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p><strong>QA</strong> = setting up a great kitchen: proper hygiene rules, trained chefs, quality ingredient policies. <strong>Testing</strong> = tasting every dish before it goes to the customer. QA prevents bad food; testing catches it.</p></div>
<table class="compare"><thead><tr><th></th><th>Testing</th><th>QA</th></tr></thead><tbody><tr><td>Focus</td><td><span class="tag-g">Product</span></td><td><span class="tag-b">Process</span></td></tr><tr><td>Approach</td><td>Corrective — finds & fixes defects</td><td>Preventive — improves how we work</td></tr><tr><td>Goal</td><td>Find defects in <em>this</em> software</td><td>Build processes that prevent defects in <em>all</em> software</td></tr><tr><td>Responsibility</td><td>Mainly the test team</td><td><strong>Everyone</strong> on the project</td></tr><tr><td>Type</td><td>A form of Quality Control (QC)</td><td>A superset that includes QC + testing</td></tr></tbody></table>
<div class="info-block yellow"><h3>📌 Exam Tip</h3><p>Testing is a subset of Quality Control (QC). QA is broader. Remember: <strong>QA = process + everyone's job. Testing = product + test team's job.</strong> Test results are used by both — testing uses them to fix defects, QA uses them to improve processes.</p></div>`
    },
    { id:'1_6', num:'1.2.3', title:'Errors, Defects & Failures', content:`
<div class="section-tag">Section 1.2.3</div>
<h2>Errors, Defects, Failures & Root Causes</h2>
<p class="intro-text">These 4 terms form a chain. The exam loves testing if you can tell them apart.</p>
<div class="analogy"><div class="analogy-label">Analogy — The Cooking Chain</div><p>Chef misreads recipe (<strong>error</strong>) → adds salt instead of sugar (<strong>defect</strong> in the dish) → customer spits it out (<strong>failure</strong>). Root cause? The recipe was written in confusing handwriting.</p></div>
<div class="flow"><div class="flow-step"><div class="flow-dot">🧑</div><div class="flow-content"><h4>Error (Mistake)</h4><p>A <strong>human action</strong> that produces a wrong result. Caused by: time pressure, complexity, fatigue, lack of training.</p></div></div><div class="flow-step"><div class="flow-dot">🐛</div><div class="flow-content"><h4>Defect (Bug / Fault)</h4><p>The <strong>imperfection in the work product</strong> caused by the error. It sits there waiting to be triggered.</p></div></div><div class="flow-step"><div class="flow-dot">💥</div><div class="flow-content"><h4>Failure</h4><p>The defect causes <strong>visible bad behavior</strong> when executed. Not all defects cause failures — some are never triggered.</p></div></div><div class="flow-step"><div class="flow-dot">🌱</div><div class="flow-content"><h4>Root Cause</h4><p>The <strong>fundamental reason</strong> the error happened. Addressing this prevents future similar problems.</p></div></div></div>
<div class="info-block red"><h3>⚠️ Important Nuance</h3><p>Failures can also be caused by <strong>environmental conditions</strong> — radiation, electromagnetic fields affecting firmware. Not every failure = someone wrote bad code.</p><p>Also: <strong>not every defect causes a failure</strong>. Some only trigger under very specific conditions.</p></div>`
    },
    { id:'1_7', num:'1.3', title:'7 Testing Principles', content:`
<div class="section-tag">Section 1.3</div>
<h2>The 7 Testing Principles</h2>
<p class="intro-text">These are the "laws" of software testing. Memorize them. Understand them. The exam will test all 7.</p>
<div class="principle"><div class="principle-num">01</div><div class="principle-body"><h4>Testing shows presence, not absence of defects</h4><p>Passing all tests doesn't mean zero bugs. It just means you didn't find any <em>with those tests</em>.</p><span class="real-world">🌍 A medical scan showing no cancer doesn't guarantee you're 100% healthy forever.</span></div></div>
<div class="principle"><div class="principle-num">02</div><div class="principle-body"><h4>Exhaustive testing is impossible</h4><p>You can't test every input, combination, and scenario. Use risk-based testing and prioritization instead.</p><span class="real-world">🌍 An 8-char password field has trillions of combinations. You can't test them all.</span></div></div>
<div class="principle"><div class="principle-num">03</div><div class="principle-body"><h4>Early testing saves time and money</h4><p>Find defects in requirements/design before they grow. Start static AND dynamic testing as early as possible.</p><span class="real-world">🌍 A typo in a blueprint costs pennies. Tearing down a built wall costs thousands.</span></div></div>
<div class="principle"><div class="principle-num">04</div><div class="principle-body"><h4>Defects cluster together</h4><p>Most bugs live in a small number of modules — the <strong>Pareto Principle</strong>: 80% of defects from 20% of code.</p><span class="real-world">🌍 In a city, most crime happens in a few areas. Focus resources there.</span></div></div>
<div class="principle"><div class="principle-num">05</div><div class="principle-body"><h4>Tests wear out (Pesticide Paradox)</h4><p>Running the same tests repeatedly stops finding new bugs. Regularly update and add new test cases.</p><span class="real-world">🌍 Pesticides lose effectiveness when bugs develop resistance. Keep changing your approach.</span></div></div>
<div class="principle"><div class="principle-num">06</div><div class="principle-body"><h4>Testing is context dependent</h4><p>No one-size-fits-all approach. Testing a banking app differs wildly from testing a mobile game.</p><span class="real-world">🌍 A doctor uses different tools for a child vs an elderly patient — same goal, different approach.</span></div></div>
<div class="principle"><div class="principle-num">07</div><div class="principle-body"><h4>Absence-of-defects fallacy</h4><p>Zero defects found doesn't mean success. The software might still not meet user needs or business goals.</p><span class="real-world">🌍 A car with zero mechanical defects is useless if it has 2 seats and you need to transport 6 people.</span></div></div>`
    },
    { id:'1_8', num:'1.4', title:'Test Activities & Testware', content:`
<div class="section-tag">Section 1.4</div>
<h2>Test Activities, Testware & Roles</h2>
<p class="intro-text">Testing follows a structured process — from planning to completion. Each phase produces outputs called <strong>testware</strong>.</p>
<div class="flow"><div class="flow-step"><div class="flow-dot">🗺️</div><div class="flow-content"><h4>Test Planning — "What's the game plan?"</h4><p>Define objectives, scope, resources, schedule, risks. <em>Outputs: Test Plan, Risk Register, Entry/Exit Criteria</em></p></div></div><div class="flow-step"><div class="flow-dot">📊</div><div class="flow-content"><h4>Test Monitoring & Control — "Are we on track?"</h4><p>Compare actual progress against the plan. Take corrective actions. <em>Outputs: Progress Reports, Control Directives</em></p></div></div><div class="flow-step"><div class="flow-dot">🔍</div><div class="flow-content"><h4>Test Analysis — "What do we test?"</h4><p>Analyze requirements to identify testable features and risks. <em>Outputs: Test Conditions, Defect Reports on test basis</em></p></div></div><div class="flow-step"><div class="flow-dot">✏️</div><div class="flow-content"><h4>Test Design — "How do we test it?"</h4><p>Create test cases, define test data, design test environment. <em>Outputs: Test Cases, Test Charters, Coverage Items</em></p></div></div><div class="flow-step"><div class="flow-dot">⚙️</div><div class="flow-content"><h4>Test Implementation — "Set it all up"</h4><p>Build scripts, organize suites, set up environment. <em>Outputs: Test Procedures, Test Scripts, Test Suites, Test Data</em></p></div></div><div class="flow-step"><div class="flow-dot">▶️</div><div class="flow-content"><h4>Test Execution — "Run the tests!"</h4><p>Execute tests, compare actual vs expected, log defects. <em>Outputs: Test Logs, Defect Reports</em></p></div></div><div class="flow-step"><div class="flow-dot">🏁</div><div class="flow-content"><h4>Test Completion — "Wrap it up"</h4><p>Archive testware, write lessons learned, close environment. <em>Outputs: Test Completion Report, Improvement Actions</em></p></div></div></div>
<div class="cards-grid"><div class="card"><div class="card-icon">👔</div><h4>Test Management Role</h4><p>Owns the test process & team. Focuses on: planning, monitoring, control, completion.</p></div><div class="card"><div class="card-icon">🔧</div><h4>Testing Role</h4><p>Technical/engineering side. Focuses on: analysis, design, implementation, execution.</p></div></div>
<div class="info-block"><h3>Traceability</h3><p>Good traceability links test cases → requirements → risks → results. This allows you to prove coverage, assess residual risk, and communicate progress to stakeholders meaningfully.</p></div>`
    },
    { id:'1_9', num:'1.5', title:'Skills & Independence', content:`
<div class="section-tag">Section 1.5</div>
<h2>Essential Skills & Good Practices</h2>
<p class="intro-text">Being a great tester isn't just about finding bugs — it's about communication, teamwork, and critical thinking.</p>
<div class="term-list"><div class="term"><div class="term-name">🧠 Testing Knowledge</div><div class="term-def">Know techniques, tools, and methodologies to test effectively.</div></div><div class="term"><div class="term-name">🔍 Attention to Detail</div><div class="term-def">Be thorough, careful, methodical — great testers find bugs others miss.</div></div><div class="term"><div class="term-name">💬 Communication</div><div class="term-def">Testers deliver "bad news." Communicate defects constructively without making devs feel attacked.</div></div><div class="term"><div class="term-name">💡 Analytical Thinking</div><div class="term-def">Break down complex systems, identify risks, apply creative thinking to find hidden issues.</div></div><div class="term"><div class="term-name">🛠️ Technical Knowledge</div><div class="term-def">Understanding code and tools makes your testing more efficient and insightful.</div></div><div class="term"><div class="term-name">🌐 Domain Knowledge</div><div class="term-def">Industry understanding (finance, healthcare) helps you communicate with users and spot relevant issues.</div></div></div>
<div class="info-block"><h3>🤝 Whole Team Approach (from Extreme Programming)</h3><p>Anyone can do any task, and <strong>everyone is responsible for quality</strong>. Testers and developers collaborate closely. ⚠️ Not always appropriate — safety-critical systems may need high test independence.</p></div>
<div class="info-block"><h3>🎯 Independence of Testing</h3><p><strong>No independence:</strong> Author tests own work. <strong>Some:</strong> Peer review. <strong>High:</strong> Separate test team. <strong>Very high:</strong> External organization.</p><p>More independence = different perspectives catching different defects. But: can create communication gaps and developers losing ownership of quality.</p></div>`
    },
  ]
},
{
  id:'ch2', title:'Ch 2 · Testing in SDLC', color:'#38bdf8',
  sections:[
    { id:'2_1', num:'2.1', title:'SDLC Impact on Testing', content:`
<div class="section-tag">Section 2.1 — FL-2.1.1 (K2)</div>
<h2>Testing in the Context of a Software Development Lifecycle</h2>
<p class="intro-text">An SDLC model is a high-level blueprint of how software gets built. Your choice of SDLC directly shapes <em>how</em> you test — the timing, depth, tools, and even the tester's role all change depending on the model.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of the SDLC like a construction blueprint. A prefab house (Waterfall) is designed fully upfront, built once, inspected at the end. A custom home with renovations (Agile) is built in phases with inspections happening at every stage. The inspection approach must match the build approach.</p></div>
<div class="info-block"><h3>What Changes Based on the SDLC?</h3><p>The choice of SDLC directly impacts:<br>• <strong>Scope and timing</strong> of test activities (which test levels run, and when)<br>• <strong>Level of detail</strong> of test documentation (heavy in sequential, lightweight in Agile)<br>• <strong>Choice of test techniques</strong> and overall approach<br>• <strong>Extent of test automation</strong> (higher in Agile/DevOps)<br>• <strong>Role and responsibilities</strong> of the tester</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">⬇️</div><h4>Sequential Models (Waterfall, V-Model)</h4><p>Testers review requirements and do test analysis early. But <em>dynamic testing</em> can only happen after code is written — which is late in the cycle. Defects found late are expensive.</p></div><div class="card"><div class="card-icon">🔁</div><h4>Iterative / Incremental Models</h4><p>Each iteration delivers a working increment. Both static and dynamic testing happen in <em>every iteration</em> at all test levels. Fast feedback + frequent regression testing are essential.</p></div><div class="card"><div class="card-icon">🏃</div><h4>Agile Models (Scrum, Kanban)</h4><p>Change is expected throughout the project. Lightweight documentation, experience-based testing, and <em>heavy test automation</em> are favored. Testers are embedded in the team from Day 1.</p></div><div class="card"><div class="card-icon">🔑</div><h4>Good Practice for ALL Models</h4><p>For every development activity → a corresponding test activity. Different test levels have different objectives to avoid overlap. Test analysis begins during the corresponding dev phase.</p></div></div>
<div class="info-block blue"><h3>📌 Universal Good Testing Practices (applies to ALL SDLC models)</h3><p>1. Every dev activity has a corresponding test activity.<br>2. Each test level has specific, non-redundant objectives.<br>3. Test analysis and design for a level begins during that level's dev phase (early testing).<br>4. Testers review work products as soon as drafts are available — supporting <strong>shift left</strong>.</p></div>`
    },
    { id:'2_2', num:'2.1.3', title:'TDD, ATDD & BDD', content:`
<div class="section-tag">Section 2.1.3 — FL-2.1.3 (K1)</div>
<h2>Testing as a Driver for Software Development</h2>
<p class="intro-text">What if you wrote the tests <em>before</em> you wrote the code? That's the idea behind TDD, ATDD, and BDD — three test-first approaches that flip the traditional order.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine designing an exam paper <em>before</em> writing the textbook. The exam defines exactly what students need to know — and the textbook is written to ensure students can pass it. TDD/ATDD/BDD do the same: define the "exam" (tests) first, then write the "textbook" (code) to pass.</p></div>
<div class="info-block"><h3>Test-Driven Development (TDD)</h3><p><strong>Core idea:</strong> Tests direct the coding — not the other way around.<br><strong>Process:</strong> Write a failing test → Write code to pass it → Refactor code and tests → Repeat.<br><strong>Focus:</strong> Developer-level. Mostly unit/component tests.<br><strong>Result:</strong> Code is written only to satisfy defined tests. Nothing extra.</p></div>
<div class="info-block"><h3>Acceptance Test-Driven Development (ATDD)</h3><p><strong>Core idea:</strong> Derive tests from <em>acceptance criteria</em> as part of system design.<br><strong>Who:</strong> Whole team — developers, testers, AND business representatives together.<br><strong>Process:</strong> Define acceptance tests first → Develop code to satisfy them.<br><strong>Result:</strong> Everyone agrees on "what done looks like" before a line of code is written.</p></div>
<div class="info-block"><h3>Behavior-Driven Development (BDD)</h3><p><strong>Core idea:</strong> Express desired behavior in <em>plain natural language</em> everyone can understand.<br><strong>Format:</strong> Given / When / Then<br><strong>Example:</strong><br>&nbsp;&nbsp;<span class="tag-g">Given</span> a user has a valid account,<br>&nbsp;&nbsp;<span class="tag-b">When</span> they enter correct credentials and click Login,<br>&nbsp;&nbsp;<span class="tag-y">Then</span> they are redirected to their dashboard.<br><strong>Result:</strong> Test cases can be automatically translated into executable tests (e.g., Cucumber, SpecFlow).</p></div>
<div class="info-block yellow"><h3>📌 What All Three Have in Common</h3><p>• Tests are <strong>written before the code</strong> — this is shift left in action.<br>• They all support <strong>iterative development</strong>.<br>• They all implement the principle of <strong>early testing</strong>.<br>• Tests written this way often <strong>persist as automated tests</strong> to protect quality during future changes.</p></div>`
    },
    { id:'2_3', num:'2.1.4', title:'DevOps & Testing', content:`
<div class="section-tag">Section 2.1.4 — FL-2.1.4 (K2)</div>
<h2>DevOps and Testing</h2>
<p class="intro-text">DevOps is an organizational culture and set of practices that bridges Development (including testing) and Operations — making it possible to deliver high-quality software faster and more reliably.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Traditional teams are like a relay race — dev runs their leg, then throws the baton to testing, who throws it to ops. DevOps is like a rowing team — everyone rows together, in sync, constantly. The boat moves faster and straighter.</p></div>
<div class="info-block"><h3>What is DevOps?</h3><p>DevOps promotes: <strong>team autonomy</strong>, <strong>fast feedback</strong>, <strong>integrated toolchains</strong>, and technical practices like <strong>Continuous Integration (CI)</strong> and <strong>Continuous Delivery (CD)</strong>. The goal is a delivery pipeline that builds, tests, and releases software faster without sacrificing quality.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">⚡</div><h4>Fast Feedback on Code Quality</h4><p>Every code commit triggers automated tests. Developers know within minutes if their change broke something — not weeks later.</p></div><div class="card"><div class="card-icon">⬅️</div><h4>CI Promotes Shift Left</h4><p>Developers must submit code with component tests and static analysis. Quality gates are enforced earlier in the process.</p></div><div class="card"><div class="card-icon">🤖</div><h4>Automated Processes</h4><p>CI/CD pipelines automate build, test, and deployment. Stable test environments are created automatically, reducing manual setup errors.</p></div><div class="card"><div class="card-icon">📊</div><h4>Non-Functional Visibility</h4><p>DevOps pipelines make it easier to continuously monitor performance, reliability, and security — not just functionality.</p></div></div>
<div class="info-block red"><h3>⚠️ DevOps Risks and Challenges</h3><p>• The DevOps delivery pipeline must be <strong>defined and established</strong> — this takes time and expertise.<br>• CI/CD tools must be <strong>introduced and actively maintained</strong>.<br>• Test automation requires <strong>additional resources</strong> and can be difficult to build and sustain.<br>• Even with high automation, <strong>manual testing — especially from the user's perspective — is still needed</strong>. Automation can't replace human judgment.</p></div>`
    },
    { id:'2_4', num:'2.1.5', title:'Shift Left', content:`
<div class="section-tag">Section 2.1.5 — FL-2.1.5 (K2)</div>
<h2>Shift Left</h2>
<p class="intro-text">"Shift left" means moving testing activities <em>earlier</em> in the SDLC. Instead of waiting until the end to test, you start testing thinking from the very beginning. It's the practical application of Principle 3: Early testing saves time and money.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine a factory quality check. Catching a defective part at the raw materials stage costs almost nothing. Catching it after the finished product is assembled and packaged costs a fortune. Shift left = move the quality check as far to the left (earlier) as possible.</p></div>
<div class="info-block blue"><h3>⬅️ How to Achieve Shift Left in Practice</h3><p><strong>1. Review specs as a tester</strong> — Find ambiguities, gaps, and inconsistencies in requirements <em>before</em> development starts.<br><strong>2. Write test cases before code</strong> — (TDD/ATDD/BDD) — code is then written to satisfy defined tests.<br><strong>3. Use CI/CD</strong> — Automated component tests run immediately when code is committed. Fast feedback loop.<br><strong>4. Static analysis before dynamic testing</strong> — Analyze code for defects without running it first.<br><strong>5. Non-functional testing at component level</strong> — Don't wait for a full system to test performance or security. Start early.</p></div>
<div class="info-block yellow"><h3>📌 Important Nuance</h3><p>Shift left means testing <em>earlier</em> — it does NOT mean neglecting testing later in the SDLC. You still need system testing, acceptance testing, and other later activities. Shift left adds early testing; it doesn't remove late testing.</p><p>Also: shift left may require <strong>extra investment upfront</strong> (training, tools, effort) — but it is expected to <strong>save significantly more later</strong> by catching defects when they're cheap to fix.</p></div>
<div class="info-block red"><h3>⚠️ Stakeholder Buy-In is Critical</h3><p>Shift left only works if stakeholders — management, business, developers — all understand and support it. If only testers believe in it, they'll be overruled when schedules get tight. Shift left is a cultural and organizational change, not just a testing technique.</p></div>`
    },
    { id:'2_5', num:'2.1.6', title:'Retrospectives', content:`
<div class="section-tag">Section 2.1.6 — FL-2.1.6 (K2)</div>
<h2>Retrospectives and Process Improvement</h2>
<p class="intro-text">A retrospective is a structured team meeting to reflect on how things went — what worked, what didn't, and what to do differently next time. It's a key engine of continuous improvement.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A sports team watches the game film after every match. They celebrate what worked, analyze what went wrong, and agree on adjustments for next week. Retrospectives are a software team's "game film review."</p></div>
<div class="info-block"><h3>When Do Retrospectives Happen?</h3><p>Timing depends on the SDLC model:<br>• <strong>Agile:</strong> At the end of every sprint (typically every 2–4 weeks)<br>• <strong>Sequential:</strong> At the end of the project or major milestone<br>• <strong>Anytime:</strong> When a significant problem occurs and the team needs to course-correct</p><p>Participants: NOT just testers — developers, architects, product owners, business analysts all participate.</p></div>
<div class="info-block"><h3>What Gets Discussed?</h3><p>Three core questions:<br>1. <strong>What was successful?</strong> → Retain and reinforce these practices.<br>2. <strong>What was not successful?</strong> → Identify root causes and improvement areas.<br>3. <strong>How do we improve?</strong> → Agree on concrete actions for next iteration/project.</p><p>Results are <strong>recorded</strong> and typically included in the <strong>Test Completion Report</strong>.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">🎯</div><h4>Better Test Effectiveness</h4><p>Process improvement suggestions are implemented. Testing gets smarter over time.</p></div><div class="card"><div class="card-icon">📋</div><h4>Higher Quality Testware</h4><p>Jointly reviewing test processes leads to better test cases, scripts, and documentation.</p></div><div class="card"><div class="card-icon">🤝</div><h4>Stronger Team Bonds</h4><p>Safe environment to raise issues and propose improvements builds trust and collaboration.</p></div><div class="card"><div class="card-icon">📄</div><h4>Better Test Basis Quality</h4><p>Deficiencies in requirements are surfaced and addressed, improving the foundation for future testing.</p></div></div>
<div class="info-block yellow"><h3>📌 Exam Tip</h3><p>Retrospectives are critical for <strong>continuous improvement</strong>. The ISTQB emphasizes that improvement recommendations must be <strong>followed up</strong> — a retrospective that produces a list no one acts on has failed its purpose. Also note: results feed into the <strong>test completion report</strong>.</p></div>`
    },
    { id:'2_6', num:'2.2.1', title:'Test Levels', content:`
<div class="section-tag">Section 2.2.1 — FL-2.2.1 (K2)</div>
<h2>Test Levels</h2>
<p class="intro-text">Test levels are groups of test activities organized around a specific phase of development. Each level has its own test objects, objectives, test basis, and responsible team. They're designed to avoid overlap while ensuring comprehensive coverage.</p>
<div class="analogy"><div class="analogy-label">Analogy — Building a Car</div><p>First test each <strong>part</strong> individually (engine alone, brakes alone). Then test how <strong>parts work together</strong> (engine + gearbox). Then test the <strong>whole car</strong> on a track. Finally, let <strong>the customer test drive</strong> it and approve it. Component → Integration → System → Acceptance.</p></div>
<div class="info-block"><h3>1. Component Testing (Unit Testing)</h3><p><strong>What:</strong> Test individual components in <em>isolation</em> — a function, a class, a module.<br><strong>Who:</strong> Usually <em>developers</em> in their dev environment.<br><strong>Requires:</strong> Test harnesses or unit test frameworks (e.g., JUnit, NUnit).<br><strong>Test basis:</strong> Component specs, detailed design, code itself.<br><strong>Typical defects found:</strong> Wrong logic, incorrect calculations, missing error handling.</p></div>
<div class="info-block"><h3>2. Component Integration Testing (Unit Integration Testing)</h3><p><strong>What:</strong> Test the <em>interfaces and interactions</em> between integrated components.<br><strong>Who:</strong> Usually <em>developers</em>.<br><strong>Strategy dependent:</strong> Bottom-up, top-down, or big-bang integration approaches affect how this is done.<br><strong>Typical defects found:</strong> Wrong data passed between components, timing issues, interface mismatches.</p></div>
<div class="info-block"><h3>3. System Testing</h3><p><strong>What:</strong> Test the <em>overall behavior and capabilities</em> of the entire system.<br><strong>Who:</strong> Usually an <em>independent test team</em>.<br><strong>Includes:</strong> End-to-end functional testing AND non-functional testing (performance, usability, security).<br><strong>Test basis:</strong> System requirements spec, use cases, risk analyses.<br><strong>Note:</strong> For some non-functional characteristics (like usability), a complete system in a representative environment is needed.</p></div>
<div class="info-block"><h3>4. System Integration Testing</h3><p><strong>What:</strong> Test the interfaces between <em>your system and other external systems or services</em> (third-party APIs, databases, external services).<br><strong>Requires:</strong> A test environment preferably similar to the operational (production) environment.<br><strong>Typical defects:</strong> Communication failures, wrong data formats, authentication issues between systems.</p></div>
<div class="info-block"><h3>5. Acceptance Testing</h3><p><strong>What:</strong> Validate the system is ready for deployment and fulfills <em>user business needs</em>.<br><strong>Who:</strong> Ideally <em>intended users</em> or their representatives.<br><strong>Focus:</strong> Validation (right product?) not just verification (built right?).<br><strong>Forms of acceptance testing:</strong><br>• <strong>UAT</strong> — User Acceptance Testing<br>• <strong>OAT</strong> — Operational Acceptance Testing (backup, recovery, maintenance procedures)<br>• <strong>Contractual/Regulatory</strong> — Must meet legal or contractual obligations<br>• <strong>Alpha/Beta Testing</strong> — Alpha = internal, Beta = limited external users</p></div>
<div class="info-block yellow"><h3>📌 Exam Tip — What Distinguishes Test Levels?</h3><p>Each test level is distinguished by: <strong>test object, test objectives, test basis, types of defects found, approach, and responsibilities</strong>. This is the ISTQB's way of saying: each level is unique and designed to avoid redundancy. Don't confuse test levels (when/what scope) with test types (what quality characteristic).</p></div>`
    },
    { id:'2_7', num:'2.2.2', title:'Test Types', content:`
<div class="section-tag">Section 2.2.2 — FL-2.2.2 (K2)</div>
<h2>Test Types</h2>
<p class="intro-text">While test levels answer <em>when and at what scope</em> you test, test types answer <em>what quality characteristic</em> you're evaluating. All 4 test types can be applied at every test level.</p>
<div class="cards-grid"><div class="card"><div class="card-icon">⚙️</div><h4>Functional Testing</h4><p>Tests <em>what</em> the system does — its functions. Checks: functional completeness, correctness, and appropriateness. Example: Does the login button actually log me in?</p></div><div class="card"><div class="card-icon">📈</div><h4>Non-Functional Testing</h4><p>Tests <em>how well</em> the system does it. "It works" isn't enough. Evaluates quality characteristics like performance, security, usability, reliability.</p></div><div class="card"><div class="card-icon">⬛</div><h4>Black-Box Testing</h4><p>Specification-based. You cannot see the code. Tests are derived from documentation — requirements, use cases, specs. Checks behavior against specifications.</p></div><div class="card"><div class="card-icon">⬜</div><h4>White-Box Testing</h4><p>Structure-based. You can see the code, architecture, data flows. Tests are designed to cover the internal structure — logic branches, paths, conditions.</p></div></div>
<div class="info-block"><h3>Non-Functional Quality Characteristics (ISO/IEC 25010)</h3><p>The ISTQB syllabus lists 8 non-functional characteristics to know:<br>• <strong>Performance efficiency</strong> — Speed, response time, resource usage under load<br>• <strong>Compatibility</strong> — Works alongside other systems/software<br>• <strong>Usability</strong> (Interaction capability) — How easily users can use it<br>• <strong>Reliability</strong> — How consistently it performs without failure<br>• <strong>Security</strong> — Protection against unauthorized access or attacks<br>• <strong>Maintainability</strong> — How easily it can be modified and updated<br>• <strong>Portability</strong> (Flexibility) — Ease of moving to different environments<br>• <strong>Safety</strong> — Does not cause harm to people or property</p></div>
<div class="info-block yellow"><h3>📌 Non-Functional Testing — Key Exam Points</h3><p>• Non-functional testing can <strong>start early</strong> (e.g., at component level) — this is a form of shift left.<br>• Many non-functional tests are <strong>derived from functional tests</strong> — same actions, but checking if a constraint is satisfied (e.g., login works AND loads within 2 seconds).<br>• <strong>Late discovery</strong> of non-functional defects is a serious project risk — finding a performance problem after full system build is very expensive to fix.<br>• Some non-functional tests need <strong>special environments</strong> — usability labs, production-like environments for performance.</p></div>`
    },
    { id:'2_8', num:'2.2.3', title:'Confirmation & Regression Testing', content:`
<div class="section-tag">Section 2.2.3 — FL-2.2.3 (K2)</div>
<h2>Confirmation Testing vs. Regression Testing</h2>
<p class="intro-text">Whenever a change is made to software — whether a bug fix or a new feature — two types of testing must follow. These are among the most commonly tested topics in the exam.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A mechanic fixes your car's broken headlight (<strong>the defect</strong>). You check that the headlight now works — that's <strong>confirmation testing</strong>. Then you check that fixing the headlight didn't accidentally disconnect the horn or the dashboard lights — that's <strong>regression testing</strong>.</p></div>
<div class="info-block"><h3>Confirmation Testing</h3><p><strong>Purpose:</strong> Confirm that a specific defect has been successfully fixed.<br><strong>How:</strong> Re-execute the tests that previously failed due to the defect. May also add new tests if the fix required code changes beyond the original defect.<br><strong>When time is short:</strong> At minimum, re-run just the steps that reproduced the original failure and verify it no longer occurs.<br><strong>Key rule:</strong> Ideally performed by the <em>same tester</em> who originally found the defect.</p></div>
<div class="info-block"><h3>Regression Testing</h3><p><strong>Purpose:</strong> Confirm that a change (fix, enhancement, configuration change) has NOT caused adverse consequences elsewhere in the system.<br><strong>Scope:</strong> Can extend to other components, other systems, or even the environment — not just the changed area.<br><strong>First step:</strong> Perform <strong>impact analysis</strong> to identify which parts of the software could be affected by the change. This guides how much regression testing is needed.<br><strong>Grows over time:</strong> The regression test suite grows with each iteration. Eventually this becomes very large — making it the prime candidate for <strong>automation</strong>.</p></div>
<div class="info-block blue"><h3>🤖 Regression Testing & Automation</h3><p>Because regression tests are run <em>many times</em> and the suite <em>grows with every release</em>, manual regression testing becomes impractical. This is why regression testing is the <strong>strongest candidate for test automation</strong>. In DevOps/CI environments, automated regression tests run on every code commit — giving instant feedback on whether changes broke anything.</p></div>
<div class="info-block yellow"><h3>📌 Classic Exam Trap — Don't Mix These Up!</h3><p><strong>Confirmation testing</strong> = "Did the fix work?" (re-test the original failing test)<br><strong>Regression testing</strong> = "Did the fix break anything else?" (test the surrounding system)<br><br>Both are needed after every fix. In sequential models: done in that order. In Agile/CI: often automated and run simultaneously.</p></div>`
    },
    { id:'2_9', num:'2.3', title:'Maintenance Testing', content:`
<div class="section-tag">Section 2.3 — FL-2.3.1 (K2)</div>
<h2>Maintenance Testing</h2>
<p class="intro-text">Software doesn't stop needing tests once it's released. When a live system changes — for any reason — it must be tested again. This is maintenance testing.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>You buy a car and it works perfectly. A year later you upgrade the engine. You need to test the whole car again — not just the new engine — because the change might have affected the gearbox, the cooling system, or the dashboard sensors. That's exactly what maintenance testing does for software.</p></div>
<div class="info-block"><h3>What Triggers Maintenance Testing?</h3><p>The ISTQB syllabus defines three categories of triggers:</p><p><strong>1. Modifications:</strong><br>• Planned enhancements (release-based) — adding new features<br>• Corrective changes — fixing bugs in the live system<br>• Hot fixes — emergency patches deployed immediately</p><p><strong>2. Upgrades or Migrations:</strong><br>• Moving to a new platform, OS, database, or cloud environment<br>• Migrating data from another application into the system<br>• Requires testing the new environment AND the changed software, AND data conversion</p><p><strong>3. Retirement:</strong><br>• When a system reaches end-of-life<br>• Requires testing of <em>data archiving</em> (if long retention is needed)<br>• Testing of <em>restore and retrieval procedures</em> in case archived data must be accessed later</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">⚠️</div><h4>Impact Analysis — Do This First</h4><p>Before testing (even before making the change!), analyze what areas could be affected. This determines the <em>scope</em> of regression testing needed and helps decide whether the change is worth the risk.</p></div><div class="card"><div class="card-icon">📐</div><h4>Scope Depends On...</h4><p>• Degree of risk of the change<br>• Size of the existing system<br>• Size of the change itself<br>A tiny hotfix to a small system = small scope. A platform migration of a large system = massive scope.</p></div><div class="card"><div class="card-icon">✅</div><h4>What to Test</h4><p>Two things: (1) Did the change work correctly? (2) Did the change break anything in the parts that weren't changed? The second part is usually <em>most</em> of the system.</p></div><div class="card"><div class="card-icon">🔥</div><h4>Hot Fix Scenario</h4><p>Unplanned emergency fix deployed directly to production. Needs fast confirmation testing + focused regression testing on critical paths. Often done under time pressure — risk must be managed carefully.</p></div></div>
<div class="info-block yellow"><h3>📌 Exam Tip — Scope of Maintenance Testing</h3><p>The scope depends on: <strong>risk of the change + size of existing system + size of the change</strong>. Impact analysis is performed <em>before</em> the change, not after. Also remember: retirement triggers testing of <strong>data archiving and retrieval procedures</strong> — this is a specific detail the exam may ask about.</p></div>`
    },
  ]
},
{
  id:'ch3', title:'Ch 3 · Static Testing', color:'#a78bfa',
  sections:[
    { id:'3_1', num:'3.1.1', title:'Work Products & Static Testing', content:`
<div class="section-tag">Section 3.1.1 — FL-3.1.1 (K1)</div>
<h2>Static Testing Basics</h2>
<p class="intro-text">Static testing examines software work products <em>without executing</em> the code. It covers everything from manual reviews to automated static analysis tools — and it can be applied far earlier than dynamic testing.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Dynamic testing = cooking a dish and tasting it to find problems.<br>Static testing = carefully reading the recipe before you even turn on the stove — catching wrong ingredients, ambiguous instructions, missing steps. You prevent the disaster before it happens.</p></div>
<div class="info-block"><h3>What is Static Testing?</h3><p>In static testing, work products are evaluated through:<br>• <strong>Manual examination</strong> — reviews by people (walkthroughs, inspections, technical reviews)<br>• <strong>Tool-based analysis</strong> — static analysis tools that scan code or artifacts without running them<br><br>Static testing can be applied for both <strong>verification</strong> (does it match specs?) and <strong>validation</strong> (does it meet real needs?).</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">📄</div><h4>Work Products You CAN Statically Test</h4><p>Requirements specs, user stories, acceptance criteria, source code, test plans, test cases, product backlog items, test charters, project documentation, contracts, architecture models — anything that can be read and understood.</p></div><div class="card"><div class="card-icon">🚫</div><h4>Work Products You CANNOT Statically Test</h4><p>Products difficult for humans to interpret AND that shouldn't be analyzed by tools — e.g., <strong>3rd party executable code</strong> (due to legal reasons). If it can't be read or structured-checked, static testing doesn't apply.</p></div><div class="card"><div class="card-icon">👀</div><h4>Reviews (Manual)</h4><p>Humans examine the work product. Examples: walkthroughs, technical reviews, inspections. Any readable work product qualifies.</p></div><div class="card"><div class="card-icon">🤖</div><h4>Static Analysis (Tool-Based)</h4><p>Tools check code or structured artifacts without executing them. Works on anything with a defined structure: code, models, formal text. Often built into CI pipelines. Examples: SonarQube, ESLint, Checkstyle.</p></div></div>
<div class="info-block blue"><h3>Static Analysis in Modern Workflows</h3><p>Static analysis is often incorporated into <strong>CI frameworks</strong> (continuous integration). Every time code is committed, static analysis tools automatically scan it for defects — giving developers instant feedback without running any tests. Spelling checkers and readability tools are also simple examples of static analysis.</p></div>
<div class="info-block"><h3>Role of Testers in Agile Static Testing</h3><p>In Agile, testers, business representatives (product owners, business analysts), and developers work together in <strong>example mapping, collaborative user story writing, and backlog refinement sessions</strong>. Testers ask the right questions to ensure user stories are complete, understandable, and include testable acceptance criteria — this is static testing in practice, even if it doesn't always get called that.</p></div>`
    },
    { id:'3_2', num:'3.1.2', title:'Value of Static Testing', content:`
<div class="section-tag">Section 3.1.2 — FL-3.1.2 (K2)</div>
<h2>The Value of Static Testing</h2>
<p class="intro-text">Why bother with static testing when you can just run the software and see what breaks? Because static testing catches things dynamic testing simply cannot — and it does so far cheaper.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>It's cheaper to proofread a legal contract before signing it than to go to court after discovering an ambiguous clause. Static testing is that proofreading — it catches problems when they're easiest and cheapest to fix.</p></div>
<div class="info-block"><h3>What Makes Static Testing Valuable?</h3><p>• <strong>Earliest defect detection</strong> — finds defects in the first phases of the SDLC, fulfilling the early testing principle.<br>• <strong>Finds defects dynamic testing can't</strong> — unreachable code, design patterns not implemented as intended, defects in non-executable work products like requirements.<br>• <strong>Evaluates quality beyond functionality</strong> — readability, completeness, correctness, testability, consistency.<br>• <strong>Builds confidence and shared understanding</strong> — stakeholders reviewing requirements together align on actual needs early.<br>• <strong>Improves communication</strong> — involving a wide variety of stakeholders in static testing surfaces misunderstandings early.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">💰</div><h4>Overall Cost Reduction</h4><p>Reviews are costly to run, but projects with reviews spend <em>less overall</em> — because defects fixed early are far cheaper than defects found after deployment.</p></div><div class="card"><div class="card-icon">🐛</div><h4>Fewer Code Defects</h4><p>Static analysis detects certain code defects <em>more efficiently</em> than dynamic testing, resulting in fewer defects in the final product and lower overall development effort.</p></div><div class="card"><div class="card-icon">🔍</div><h4>Hard-to-Reach Defects</h4><p>Static testing can find defects on code paths that are <em>rarely executed</em> or very hard to trigger through dynamic testing — like an error handler that only activates under extreme conditions.</p></div><div class="card"><div class="card-icon">📋</div><h4>Non-Executable Defects</h4><p>Requirements ambiguities, contradictions, missing acceptance criteria — these exist in documents, not code. Only static testing can find them before they become expensive code defects.</p></div></div>`
    },
    { id:'3_3', num:'3.1.3', title:'Static vs. Dynamic Testing', content:`
<div class="section-tag">Section 3.1.3 — FL-3.1.3 (K2)</div>
<h2>Static Testing vs. Dynamic Testing</h2>
<p class="intro-text">Static and dynamic testing are complementary — not competing. They have overlapping goals but find different types of defects through fundamentally different mechanisms. The exam tests whether you know the key differences.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Static testing = a structural engineer inspecting blueprints for design flaws before building starts.<br>Dynamic testing = a safety inspector testing the finished building by actually opening doors, testing elevators, and checking fire escapes.<br>Both are needed. Both catch different things.</p></div>
<table class="compare"><thead><tr><th></th><th>Static Testing</th><th>Dynamic Testing</th></tr></thead>
<tbody>
<tr><td>Execution?</td><td><span class="tag-p">No — software NOT run</span></td><td><span class="tag-b">Yes — software IS run</span></td></tr>
<tr><td>How defects found</td><td>Found <strong>directly</strong> during examination</td><td>Failure observed → defect diagnosed afterwards</td></tr>
<tr><td>Work products</td><td>Executable AND non-executable (requirements, designs, docs)</td><td>Only <strong>executable</strong> work products</td></tr>
<tr><td>When applicable</td><td>From the very first artifacts (requirements)</td><td>After code is written and can be run</td></tr>
<tr><td>Quality measured</td><td>Maintainability, completeness, consistency (not execution-dependent)</td><td>Performance efficiency, reliability (execution-dependent)</td></tr>
<tr><td>Hard-to-reach paths</td><td>Finds defects on <strong>rarely executed paths</strong> easily</td><td>Rarely executed paths are hard to trigger in tests</td></tr>
</tbody></table>
<div class="info-block yellow"><h3>📌 Defects That ONLY Static Testing Finds</h3><p>• Inconsistencies, ambiguities, contradictions in <strong>requirements</strong><br>• Design defects (inefficient database structures, poor modularization)<br>• Unreachable code, undeclared variables, excessive complexity<br>• Deviations from <strong>coding standards</strong> (naming conventions, formatting)<br>• Incorrect interface specs (mismatched parameter types or order)<br>• Specific <strong>security vulnerabilities</strong> (e.g., buffer overflows identified at code level)<br>• Gaps in test basis — <strong>missing tests for acceptance criteria</strong></p></div>
<div class="info-block red"><h3>⚠️ Key Exam Distinction</h3><p>Static testing <strong>finds defects directly</strong> — no failure occurs, no diagnosis needed, just remove the defect. Dynamic testing <strong>causes failures</strong> — then you analyze the failure to find the underlying defect. This is a critical difference the exam regularly tests.</p></div>`
    },
    { id:'3_4', num:'3.2.1', title:'Early Stakeholder Feedback', content:`
<div class="section-tag">Section 3.2.1 — FL-3.2.1 (K1)</div>
<h2>Benefits of Early and Frequent Stakeholder Feedback</h2>
<p class="intro-text">One of the biggest causes of project failure is building the wrong thing. Early and frequent feedback from stakeholders — enabled by static testing and reviews — is the antidote.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine building someone a custom house but only showing them the result when it's fully built. If they wanted 3 bedrooms but you built 2, you're tearing down walls. Now imagine showing them the blueprints every week and getting feedback. The house gets built right the first time.</p></div>
<div class="info-block"><h3>What Happens Without Early Feedback?</h3><p>If stakeholders are only involved at the end of the SDLC:<br>• The product may not match the stakeholder's <em>original or current vision</em><br>• Requirements misunderstandings are discovered late — when they're expensive to fix<br>• Results: <strong>costly rework, missed deadlines, blame games, and even complete project failure</strong></p></div>
<div class="info-block blue"><h3>What Frequent Feedback Enables</h3><p>• <strong>Early communication</strong> of potential quality problems — before they become crises<br>• <strong>Requirements changes understood earlier</strong> — the development team adjusts while changes are still cheap<br>• <strong>Better focus</strong> on features that deliver the most value and address the highest risks<br>• <strong>Shared understanding</strong> — the team knows what they're building and why<br>• <strong>Fewer surprises</strong> at delivery — stakeholders have been involved all along</p></div>
<div class="info-block yellow"><h3>📌 Exam Tip</h3><p>The ISTQB syllabus frames early stakeholder feedback as a <strong>benefit of static testing and reviews</strong> — specifically section 3.2. When asked why reviews matter, "early and frequent stakeholder feedback prevents misunderstandings and costly rework" is a key answer to remember.</p></div>`
    },
    { id:'3_5', num:'3.2.2', title:'Review Process Activities', content:`
<div class="section-tag">Section 3.2.2 — FL-3.2.2 (K2)</div>
<h2>Review Process Activities</h2>
<p class="intro-text">The ISO/IEC 20246 standard defines a generic review process — a structured but flexible framework that can be tailored to any situation. More formal reviews use more of these activities.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of reviewing a work product like a legal case review. You plan what to examine (planning), brief the legal team (initiation), each lawyer reviews documents independently (individual review), the team meets to discuss findings (communication & analysis), corrections are made and the case is filed (fixing & reporting).</p></div>
<div class="info-block yellow"><h3>📌 Important Note Before We Start</h3><p>Anomalies found during a review are <strong>not necessarily defects</strong>. An anomaly is anything that deviates from what's expected — it could be a defect, a question, a suggestion, or a misunderstanding. All anomalies must be analyzed before deciding which ones are actual defects requiring a fix.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot">📋</div><div class="flow-content"><h4>1. Planning</h4><p>Define: scope, purpose, quality characteristics to evaluate, areas to focus on, exit criteria, standards to apply, effort estimate, and timeframe. This shapes everything that follows.</p></div></div>
<div class="flow-step"><div class="flow-dot">🚀</div><div class="flow-content"><h4>2. Review Initiation</h4><p>Ensure everyone is prepared and ready. Every participant must have: access to the work product, understanding of their role and responsibilities, and all materials needed to perform their review.</p></div></div>
<div class="flow-step"><div class="flow-dot">🔍</div><div class="flow-content"><h4>3. Individual Review</h4><p>Each reviewer independently examines the work product and logs all <strong>anomalies, recommendations, and questions</strong>. They apply review techniques (e.g., checklist-based, scenario-based). This is done BEFORE the group meeting.</p></div></div>
<div class="flow-step"><div class="flow-dot">💬</div><div class="flow-content"><h4>4. Communication & Analysis</h4><p>All anomalies are discussed — typically in a review meeting. For every anomaly: decide its <strong>status, ownership, and required action</strong>. The team agrees on the quality level of the work product and what follow-up is needed. A follow-up review may be required.</p></div></div>
<div class="flow-step"><div class="flow-dot">✅</div><div class="flow-content"><h4>5. Fixing & Reporting</h4><p>A defect report is created for every confirmed defect so fixes can be tracked. Once exit criteria are met, the work product is accepted. Review results are formally reported.</p></div></div>
</div>
<div class="info-block"><h3>Practical Note on Size</h3><p>Large work products are too big for a single review. The review process can be invoked <strong>multiple times</strong> across different sections of the same document until the entire work product has been reviewed.</p></div>`
    },
    { id:'3_6', num:'3.2.3', title:'Review Roles & Responsibilities', content:`
<div class="section-tag">Section 3.2.3 — FL-3.2.3 (K1)</div>
<h2>Roles and Responsibilities in Reviews</h2>
<p class="intro-text">Reviews involve multiple people, each with a distinct role. Understanding who does what — and who does NOT do what — is critical for the exam, especially for Inspections.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of a review like a film production: the <strong>director</strong> (manager) greenlights the project, the <strong>screenwriter</strong> (author) creates the script, the <strong>editor</strong> (moderator) keeps the review meeting on track, the <strong>script supervisors</strong> (reviewers) spot continuity errors, and the <strong>production assistant</strong> (scribe) documents everything.</p></div>
<div class="term-list">
<div class="term"><div class="term-name">👔 Manager</div><div class="term-def">Decides what is to be reviewed. Provides resources — staff time, tools, and budget for the review. Makes the review happen organizationally.</div></div>
<div class="term"><div class="term-name">✏️ Author</div><div class="term-def">Creates the work product being reviewed. Responsible for fixing defects identified during the review. In Inspections, the author <strong>cannot</strong> be the review leader or scribe.</div></div>
<div class="term"><div class="term-name">🎙️ Moderator (Facilitator)</div><div class="term-def">Ensures the review meeting runs effectively. Responsible for: mediation between participants, time management, and creating a <strong>safe environment</strong> where everyone can speak freely without fear of blame.</div></div>
<div class="term"><div class="term-name">📝 Scribe (Recorder)</div><div class="term-def">Collects anomalies from reviewers and records review information — decisions made, new anomalies found during the meeting. Creates the official record of the review.</div></div>
<div class="term"><div class="term-name">🔍 Reviewer</div><div class="term-def">Performs the actual review — examines the work product and identifies anomalies. Can be a project team member, subject matter expert, or any other stakeholder with relevant knowledge.</div></div>
<div class="term"><div class="term-name">🏆 Review Leader</div><div class="term-def">Takes overall responsibility for the review: decides who participates, organizes when and where the review takes place. Plans the whole review event.</div></div>
</div>
<div class="info-block yellow"><h3>📌 Critical Exam Point — Inspection Role Restriction</h3><p>In an <strong>Inspection</strong> (the most formal review type), the <strong>author CANNOT act as the review leader OR the scribe</strong>. This is explicitly stated in the ISTQB syllabus and is a very common exam question. The author is present and fixes defects — but cannot control the review process or record the findings.</p></div>
<div class="info-block"><h3>One Person, Multiple Roles?</h3><p>Yes — in less formal reviews, one person may hold multiple roles. In a walkthrough, the author might also act as the moderator. However, in formal inspections, roles are strictly separated to ensure independence and objectivity.</p></div>`
    },
    { id:'3_7', num:'3.2.4', title:'Review Types', content:`
<div class="section-tag">Section 3.2.4 — FL-3.2.4 (K2)</div>
<h2>Review Types</h2>
<p class="intro-text">There is a spectrum of review formality — from a quick colleague glance to a rigorous structured inspection. Choosing the right type depends on the work product's criticality, the project context, and what you're trying to achieve.</p>
<div class="info-block"><h3>What Determines the Right Review Type?</h3><p>• SDLC model being followed<br>• Maturity of the development process<br>• Criticality and complexity of the work product<br>• Legal or regulatory requirements<br>• Need for an audit trail<br>• Available resources and project needs<br>• Business domain and company culture<br><br>The <strong>same work product</strong> can go through different review types at different times — e.g., an informal review first for early feedback, then a formal inspection before release.</p></div>
<table class="compare"><thead><tr><th>Review Type</th><th>Formality</th><th>Who Leads?</th><th>Key Characteristics & Objectives</th></tr></thead>
<tbody>
<tr><td><span class="tag-p">Informal Review</span></td><td>Very Low</td><td>Anyone / No formal leader</td><td>No defined process. No formal documented output required. Main objective: <strong>detect anomalies</strong>. Example: asking a colleague to look at your test cases.</td></tr>
<tr><td><span class="tag-b">Walkthrough</span></td><td>Low–Medium</td><td><strong>Author</strong> leads</td><td>Can serve many objectives: evaluate quality, build confidence, educate reviewers, gain consensus, generate new ideas, motivate authors. Individual review before the meeting is <em>not required</em>. Scenarios and dry runs may be used.</td></tr>
<tr><td><span class="tag-y">Technical Review</span></td><td>Medium</td><td><strong>Moderator</strong> leads (technically qualified)</td><td>Performed by technically qualified reviewers. Objectives: gain consensus on technical problems, detect anomalies, evaluate quality, build confidence, generate new ideas, motivate authors.</td></tr>
<tr><td><span class="tag-g">Inspection</span></td><td>Very High (most formal)</td><td><strong>Moderator</strong> leads (NOT the author)</td><td>Follows the complete generic review process. Main objective: find the <strong>maximum number of anomalies</strong>. Also: evaluate quality, build confidence, motivate authors. <strong>Metrics are collected</strong> and used to improve the SDLC. Author CANNOT be review leader or scribe.</td></tr>
</tbody></table>
<div class="info-block yellow"><h3>📌 Exam Tip — Key Distinctions Between Types</h3><p><strong>Walkthrough</strong> = Author leads. No preparation required from reviewers. Educational focus.<br><strong>Technical Review</strong> = Moderator-led. Technically qualified reviewers. Consensus on technical issues.<br><strong>Inspection</strong> = Most formal. Metrics collected. Author NOT leader/scribe. Maximum anomaly detection is primary goal.<br><strong>Informal</strong> = No process, no documented output. Just: spot the anomaly.</p></div>`
    },
    { id:'3_8', num:'3.2.5', title:'Success Factors for Reviews', content:`
<div class="section-tag">Section 3.2.5 — FL-3.2.5 (K1)</div>
<h2>Success Factors for Reviews</h2>
<p class="intro-text">Even the best review process can fail if the conditions aren't right. These are the factors that determine whether a review actually achieves its objectives — and the exam expects you to know them.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A well-designed courtroom procedure still fails if the lawyers aren't prepared, the judge is biased, witnesses are afraid to speak, or management pressures a particular outcome. Reviews work the same way — the process is only as good as the environment and people around it.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">🎯</div><h4>Clear Objectives & Exit Criteria</h4><p>Define measurable success upfront. <strong>Evaluating participants should NEVER be an objective</strong> — this creates fear and destroys honest feedback.</p></div>
<div class="card"><div class="card-icon">🔀</div><h4>Right Review Type</h4><p>Choose the review type that fits the objectives, work product type, participants, project needs, and context. Mismatch = wasted effort.</p></div>
<div class="card"><div class="card-icon">📦</div><h4>Small Chunks</h4><p>Review small pieces at a time so reviewers maintain focus and concentration. Large work products lose reviewer attention.</p></div>
<div class="card"><div class="card-icon">💬</div><h4>Feedback to Authors</h4><p>Share review findings constructively with stakeholders and authors so they can improve the product AND their own activities.</p></div>
<div class="card"><div class="card-icon">⏰</div><h4>Adequate Preparation Time</h4><p>Give participants enough time to properly prepare before the review. Unprepared reviewers find fewer defects.</p></div>
<div class="card"><div class="card-icon">👔</div><h4>Management Support</h4><p>Reviews need management buy-in — time, budget, and cultural support. Without it, reviews get skipped when schedules tighten.</p></div>
