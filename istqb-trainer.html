<div class="card"><div class="card-icon">🏢</div><h4>Organizational Culture</h4><p>Make reviews part of the culture — a tool for learning and improvement, not blame. Psychological safety is essential.</p></div>
<div class="card"><div class="card-icon">🎓</div><h4>Adequate Training</h4><p>All participants need to know how to fulfil their role — reviewers must know how to review, scribes must know how to record. Training enables effective participation.</p></div></div>
<div class="info-block red"><h3>⚠️ What NOT to Do — Most Important Failure Factor</h3><p>The syllabus explicitly states: <strong>"Evaluation of participants should never be an objective."</strong> If people believe their performance is being judged based on what they find (or don't find), they will not review honestly or thoroughly. Reviews must be a safe, blame-free environment focused entirely on improving the work product.</p></div>`
    },
  ]
},
{
  id:'ch4', title:'Ch 4 · Test Techniques', color:'#f59e0b',
  sections:[
    { id:'4_1', num:'4.1', title:'Test Techniques Overview', content:`
<div class="section-tag">Section 4.1 — FL-4.1.1 (K2)</div>
<h2>Test Techniques Overview</h2>
<p class="intro-text">Test techniques are your toolkit for answering two fundamental questions: <em>What should I test?</em> (test analysis) and <em>How should I test it?</em> (test design). They help you build a small but effective set of test cases systematically.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A master chef doesn't just randomly taste everything — they use specific techniques: taste for salt at a boundary (BVA), check if a dish works for a vegetarian AND a meat-eater (EP), confirm the recipe rules produce the right result (decision table). Test techniques are those structured approaches applied to software.</p></div>
<div class="info-block"><h3>What Do Test Techniques Help You Do?</h3><p>• Define <strong>test conditions</strong> — what aspects of the software need to be checked<br>• Identify <strong>coverage items</strong> — specific items that test cases must exercise<br>• Identify <strong>test data</strong> — concrete values to use in test cases<br>• Develop a <strong>relatively small but sufficient</strong> set of test cases in a systematic way</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">⬛</div><h4>Black-Box Techniques</h4><p>Also called <strong>specification-based techniques</strong>. Based on the <em>specified behavior</em> — no knowledge of internal code needed. Tests remain valid even if implementation changes (as long as required behavior stays the same).</p></div><div class="card"><div class="card-icon">⬜</div><h4>White-Box Techniques</h4><p>Also called <strong>structure-based techniques</strong>. Based on the <em>internal structure and processing</em> of the code. Can only be created after the design or implementation exists.</p></div><div class="card"><div class="card-icon">🧭</div><h4>Experience-Based Techniques</h4><p>Leverage the <em>knowledge and experience</em> of the tester. Effectiveness depends heavily on tester skill. Complementary to black-box and white-box — they detect defects those techniques may miss.</p></div></div>
<div class="info-block yellow"><h3>📌 Exam Key Point</h3><p>Experience-based techniques are <strong>complementary</strong> to black-box and white-box — they fill the gaps left by formal techniques. All three categories are used together on real projects for maximum coverage.</p></div>`
    },
    { id:'4_2', num:'4.2.1', title:'Equivalence Partitioning', content:`
<div class="section-tag">Section 4.2.1 — FL-4.2.1 (K3)</div>
<h2>Equivalence Partitioning (EP)</h2>
<p class="intro-text">EP divides data into groups where all values behave the same way. If one value from the group finds a defect, any other value from that group would too — so one test per group is enough.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine testing how a cinema handles customers by age — Child (under 12), Adult (12-64), Senior (65+). You don't need to test every single age. Pick one from each group: 8 (child), 35 (adult), 70 (senior). Same behavior = same test result.</p></div>
<div class="info-block"><h3>How EP Works</h3><p>Partitions can be identified for: <strong>inputs, outputs, configuration items, internal values, time-related values, and interface parameters</strong>.</p><p>Partitions may be: continuous or discrete, ordered or unordered, finite or infinite.</p><p><strong>Rules:</strong> Partitions must NOT overlap. Each partition must be non-empty.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">✅</div><h4>Valid Partitions</h4><p>Values that should be <em>processed</em> by the system (accepted/handled correctly). Testing here confirms correct behavior.</p></div><div class="card"><div class="card-icon">❌</div><h4>Invalid Partitions</h4><p>Values that should be <em>rejected or ignored</em> by the system. Testing here confirms the system handles bad input gracefully. <strong>Must be included in coverage!</strong></p></div></div>
<div class="info-block blue"><h3>Coverage in EP</h3><p><strong>Coverage items = the equivalence partitions themselves.</strong><br><strong>100% EP coverage</strong> = all identified partitions (including invalid) each covered by at least one test case.<br><strong>Formula:</strong> (Partitions covered by ≥1 test case ÷ Total identified partitions) × 100%</p><p><strong>Multiple parameters?</strong> Use <em>Each Choice Coverage</em> — ensure each partition from each parameter is covered at least once. Note: this does NOT account for combinations.</p></div>
<div class="info-block yellow"><h3>📌 Exam Example — Age Field: Valid 18–65</h3><p><strong>Partitions:</strong><br>• Invalid low: ≤17 (e.g., test with 10)<br>• Valid: 18–65 (e.g., test with 35)<br>• Invalid high: ≥66 (e.g., test with 80)<br><br><strong>3 partitions = minimum 3 test cases for 100% EP coverage.</strong></p></div>`
    },
    { id:'4_2b', num:'4.2.2', title:'Boundary Value Analysis', content:`
<div class="section-tag">Section 4.2.2 — FL-4.2.2 (K3)</div>
<h2>Boundary Value Analysis (BVA)</h2>
<p class="intro-text">Developers make the most mistakes at the edges of their conditions — "off-by-one" errors are extremely common. BVA focuses testing exactly where bugs are most likely to hide.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of a bouncer at a club with an age limit of 18+. The ambiguity is always at the edge — is a person who is exactly 18 allowed in? What about 17 years and 364 days? Bugs cluster at these boundary cases.</p></div>
<div class="info-block"><h3>BVA Basics</h3><p>• BVA can ONLY be used for <strong>ordered partitions</strong>.<br>• The minimum and maximum values of a partition are its <strong>boundary values</strong>.<br>• Typical defects: boundaries are misplaced above or below their intended position, or omitted entirely.</p></div>
<table class="compare"><thead><tr><th></th><th>2-Value BVA</th><th>3-Value BVA</th></tr></thead>
<tbody>
<tr><td><strong>Items per boundary</strong></td><td>2 — the boundary value + its closest neighbor in the adjacent partition</td><td>3 — the boundary value + BOTH its neighbors (one on each side)</td></tr>
<tr><td><strong>100% coverage requires</strong></td><td>All identified boundary values</td><td>All boundary values AND all their neighbors</td></tr>
<tr><td><strong>Rigorousness</strong></td><td>Less rigorous</td><td><span class="tag-g">More rigorous</span> — catches defects 2-value misses</td></tr>
<tr><td><strong>Example (range 1–10)</strong></td><td>Test: 1, 10, 0, 11</td><td>Test: 0, 1, 2 and 9, 10, 11</td></tr>
</tbody></table>
<div class="info-block red"><h3>⚠️ Why 3-Value BVA Matters — Classic Example</h3><p>Condition should be: <code>if (x ≤ 10)</code> but developer coded it as <code>if (x = 10)</code></p><p><strong>2-value BVA test data</strong> (x=10, x=11): x=10 passes (both conditions true), x=11 fails (both conditions false). <strong>The defect is hidden!</strong></p><p><strong>3-value BVA test data</strong> adds x=9: <code>if (x ≤ 10)</code> should be TRUE for x=9, but <code>if (x = 10)</code> is FALSE. <strong>Defect detected!</strong></p></div>
<div class="info-block yellow"><h3>📌 Exam Tip — Coverage Formula</h3><p><strong>2-value:</strong> (Boundary values exercised ÷ Total identified boundary values) × 100%<br><strong>3-value:</strong> (Boundary values + neighbors exercised ÷ Total boundary values + neighbors) × 100%</p></div>`
    },
    { id:'4_2c', num:'4.2.3', title:'Decision Table Testing', content:`
<div class="section-tag">Section 4.2.3 — FL-4.2.3 (K3)</div>
<h2>Decision Table Testing</h2>
<p class="intro-text">When a system's outcome depends on combinations of multiple conditions — especially business rules — decision tables make sure you don't miss any scenario.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of a bank loan system: "Approve if income is high AND credit score is good, OR if income is medium AND credit score is excellent." There are many combinations. A decision table maps every possible scenario systematically — like a truth table for your business rules.</p></div>
<div class="info-block"><h3>Structure of a Decision Table</h3><p><strong>Rows:</strong> Conditions (inputs) + Actions (outputs)<br><strong>Columns:</strong> Each column = one decision rule = one unique combination of conditions + its resulting action<br><br><strong>Notation for conditions:</strong> <code>T</code> = condition satisfied, <code>F</code> = not satisfied, <code>–</code> = irrelevant (doesn't affect outcome), <code>N/A</code> = infeasible combination<br><strong>Notation for actions:</strong> <code>X</code> = action occurs, <em>blank</em> = action does not occur</p></div>
<div class="info-block blue"><h3>Example — Loan Approval Decision Table</h3><table class="compare"><thead><tr><th>Condition/Action</th><th>Rule 1</th><th>Rule 2</th><th>Rule 3</th><th>Rule 4</th></tr></thead>
<tbody>
<tr><td>Good Credit Score?</td><td class="tag-g">T</td><td class="tag-g">T</td><td class="tag-r">F</td><td class="tag-r">F</td></tr>
<tr><td>Steady Income?</td><td class="tag-g">T</td><td class="tag-r">F</td><td class="tag-g">T</td><td class="tag-r">F</td></tr>
<tr><td><strong>→ Approve Loan</strong></td><td>X</td><td></td><td></td><td></td></tr>
<tr><td><strong>→ Manual Review</strong></td><td></td><td>X</td><td>X</td><td></td></tr>
<tr><td><strong>→ Reject</strong></td><td></td><td></td><td></td><td>X</td></tr>
</tbody></table></div>
<div class="info-block"><h3>Coverage & Optimization</h3><p><strong>Coverage items = feasible columns</strong> (infeasible combinations are removed).<br><strong>100% coverage</strong> = all feasible columns exercised by test cases.<br><br><strong>Simplification:</strong> Delete infeasible columns. <strong>Minimization:</strong> Merge columns where a condition is irrelevant (–). With many conditions, the number of rules grows exponentially (2ⁿ for n conditions) — use minimized tables or risk-based approach.</p></div>
<div class="info-block yellow"><h3>📌 Strength of Decision Table Testing</h3><p>• Systematically identifies <strong>all combinations</strong> of conditions<br>• Finds <strong>gaps and contradictions</strong> in requirements<br>• Ensures no business rule combination is overlooked<br>• Works best for complex logic with 3–6 conditions</p></div>`
    },
    { id:'4_2d', num:'4.2.4', title:'State Transition Testing', content:`
<div class="section-tag">Section 4.2.4 — FL-4.2.4 (K3)</div>
<h2>State Transition Testing</h2>
<p class="intro-text">Systems often behave differently depending on their current state. State transition testing ensures that state changes work correctly — and that invalid transitions are properly rejected.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of a vending machine: it has states (Idle, Item Selected, Payment Received, Dispensing). Events cause transitions (coin inserted, button pressed, item dispensed). Some transitions are valid (insert coin when Idle → go to Item Selected), some are invalid (dispense item without payment). You must test both.</p></div>
<div class="info-block"><h3>Key Concepts</h3><p><strong>State diagram:</strong> Visual model showing states (circles) and transitions (arrows). Transition label syntax: <code>event [guard condition] / action</code><br><strong>State table:</strong> Equivalent model in table form. Rows = states, columns = events. Empty cells = <strong>invalid transitions</strong> (explicitly shown — this is the advantage over a state diagram!).</p><p>One test case usually covers <strong>several transitions</strong> (a sequence of events). Test cases are represented as sequences of events.</p></div>
<table class="compare"><thead><tr><th>Coverage Criterion</th><th>Coverage Items</th><th>To Achieve 100%</th><th>Strength</th></tr></thead>
<tbody>
<tr><td><span class="tag-y">All States Coverage</span></td><td>The states themselves</td><td>Every state visited at least once</td><td>Weakest — can skip transitions</td></tr>
<tr><td><span class="tag-b">Valid Transitions Coverage</span><br><em>(0-switch coverage)</em></td><td>Single valid transitions</td><td>Every valid transition exercised once</td><td><span class="tag-g">Most widely used</span>. Guarantees all states coverage.</td></tr>
<tr><td><span class="tag-g">All Transitions Coverage</span></td><td>All transitions (valid + invalid)</td><td>All valid transitions exercised + invalid transitions attempted</td><td>Strongest. Guarantees valid transitions + all states. Required for safety-critical software.</td></tr>
</tbody></table>
<div class="info-block red"><h3>⚠️ Defect Masking — Why Test Invalid Transitions Carefully</h3><p>When testing invalid transitions, test <strong>only ONE invalid transition per test case</strong>. Why? One defect can <em>mask</em> another — if an invalid transition causes a cascade of failures, you can't tell which specific invalid transition is the root cause.</p></div>
<div class="info-block yellow"><h3>📌 Coverage Hierarchy — Know This for the Exam</h3><p>All States ⊂ Valid Transitions ⊂ All Transitions<br><br>• Valid transitions coverage <strong>guarantees</strong> all states coverage.<br>• All transitions coverage <strong>guarantees</strong> both valid transitions AND all states coverage.<br>• All transitions coverage is the <strong>minimum requirement</strong> for mission-critical and safety-critical software.</p></div>`
    },
    { id:'4_3', num:'4.3', title:'White-Box Techniques', content:`
<div class="section-tag">Section 4.3 — FL-4.3.1/4.3.2/4.3.3 (K2)</div>
<h2>White-Box Test Techniques</h2>
<p class="intro-text">White-box techniques look <em>inside</em> the software. You design tests based on the code's internal structure — ensuring every line and every decision path is exercised.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Black-box testing is like testing a finished car as a driver — does it start, steer, brake? White-box is like being the mechanic — checking every fuel line, every wire connection, every valve. You test what the user can't see.</p></div>
<div class="info-block"><h3>4.3.1 — Statement Testing & Statement Coverage</h3><p><strong>Coverage items:</strong> Executable statements in the code.<br><strong>Goal:</strong> Design test cases so that every executable statement is exercised at least once.<br><strong>Formula:</strong> (Statements exercised by tests ÷ Total executable statements) × 100%</p><p><strong>What 100% statement coverage guarantees:</strong> Every statement with a defect WILL be executed — giving it a chance to cause a failure.<br><strong>What it does NOT guarantee:</strong> All decision logic tested. It won't necessarily exercise all branches. A data-dependent defect (like division by zero) may still be missed.</p></div>
<div class="info-block"><h3>4.3.2 — Branch Testing & Branch Coverage</h3><p>A <strong>branch</strong> = a transfer of control between two nodes in the control flow graph. Branches can be <em>unconditional</em> (straight-line code) or <em>conditional</em> (decision outcome: true/false).</p><p><strong>Coverage items:</strong> Branches (not just statements).<br><strong>Goal:</strong> Every branch — both the true and false outcomes of every decision — is exercised.<br><strong>Formula:</strong> (Branches exercised ÷ Total branches) × 100%</p><p><strong>Examples of conditional branches:</strong> <code>if...then</code> decision (true + false), <code>switch/case</code> outcomes, loop exit conditions.</p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">📊</div><h4>Branch Coverage ⊇ Statement Coverage</h4><p><strong>Branch coverage subsumes statement coverage.</strong> Any test set achieving 100% branch coverage automatically achieves 100% statement coverage — but NOT vice versa. Branch coverage is more thorough.</p></div><div class="card"><div class="card-icon">⚠️</div><h4>Limitation of Both</h4><p>Neither technique detects all defects. Data-dependent bugs (division by zero only when denominator = 0) may still slip through. Path-specific defects need even more rigorous techniques.</p></div></div>
<div class="info-block blue"><h3>4.3.3 — The Value of White-Box Testing</h3><p><strong>Fundamental strength:</strong> The entire software implementation is considered during testing. Defects can be found even when the specification is vague, outdated, or incomplete.</p><p><strong>Key weakness:</strong> If the software doesn't implement a requirement at all (defect of omission), white-box testing won't find it — there's no code to cover.</p><p><strong>Use in static testing:</strong> White-box techniques work in static testing too — dry runs of code, reviewing pseudocode, control flow graphs of code not yet ready for execution.</p><p><strong>Objective measurement:</strong> White-box coverage gives a concrete, measurable metric — unlike black-box testing, which doesn't tell you how much of the code you actually exercised.</p></div>`
    },
    { id:'4_4', num:'4.4', title:'Experience-Based Techniques', content:`
<div class="section-tag">Section 4.4 — FL-4.4.1/4.4.2/4.4.3 (K2)</div>
<h2>Experience-Based Test Techniques</h2>
<p class="intro-text">Experience-based techniques leverage what skilled testers know — about the system's history, typical developer mistakes, and how software tends to fail. They fill the gaps that formal techniques leave behind.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>An experienced pilot does more than follow the checklist — they also check things they know from experience tend to go wrong on this aircraft type, in this weather, with this crew. That veteran instinct is the equivalent of experience-based testing.</p></div>
<div class="info-block"><h3>4.4.1 — Error Guessing</h3><p>Anticipate errors, defects, and failures based on the tester's knowledge of:<br>• How the application has worked (or failed) in the <strong>past</strong><br>• The types of <strong>errors developers tend to make</strong> and the defects they produce<br>• Types of failures seen in <strong>similar applications</strong></p><p><strong>Common error categories:</strong></p><p>• <strong>Input errors:</strong> correct input rejected, parameters wrong or missing<br>• <strong>Output errors:</strong> wrong format, wrong result<br>• <strong>Logic errors:</strong> missing cases, wrong operator<br>• <strong>Computation errors:</strong> incorrect operand, wrong calculation<br>• <strong>Interface errors:</strong> parameter mismatch, incompatible types<br>• <strong>Data errors:</strong> incorrect initialization, wrong type</p><p><strong>Fault attacks:</strong> A structured form of error guessing — create/acquire a list of possible errors, defects, and failures, then design tests specifically targeting them. Lists built from experience, defect databases, or common knowledge of failure patterns.</p></div>
<div class="info-block"><h3>4.4.2 — Exploratory Testing</h3><p>Tests are <strong>simultaneously designed, executed, and evaluated</strong> while the tester learns about the test object. It's adaptive — what you discover shapes what you test next.</p><p><strong>Session-Based Exploratory Testing:</strong> Performed within a defined <strong>time box</strong> (e.g., 90 minutes). The tester uses a <strong>test charter</strong> containing test objectives to guide testing. Followed by a <strong>debriefing</strong> — discussion with stakeholders about the session's results. Tester uses <strong>test session sheets</strong> to document steps taken and discoveries made.</p><p><strong>When it shines:</strong><br>• Few or inadequate specifications<br>• Significant time pressure<br>• Complementing formal techniques<br>• When the tester is experienced, domain-knowledgeable, analytical, curious, and creative</p></div>
<div class="info-block"><h3>4.4.3 — Checklist-Based Testing</h3><p>The tester designs, implements, and executes tests to cover <strong>conditions from a checklist</strong>. Checklists are built from experience, user importance, and knowledge of how software fails.</p><p><strong>Good checklist items are:</strong><br>• Phrased as questions (e.g., "Does the form validate empty fields?")<br>• Checkable separately and directly<br>• NOT things that can be automatically checked, entry/exit criteria, or too generic</p><p><strong>Checklist maintenance:</strong> Items become less effective over time (developers learn to avoid those errors). New high-severity defects should add new entries. Regular updates based on defect analysis. Don't let it get too long.</p><p><strong>Benefit:</strong> In the absence of detailed test cases, checklists provide guidelines and consistency. High-level checklists allow for greater coverage variability — but less repeatability.</p></div>
<div class="info-block yellow"><h3>📌 All 3 Are Complementary</h3><p>Use error guessing when you know the system's weak spots. Use exploratory testing when you're learning the system or specs are thin. Use checklist-based testing to ensure consistency across sessions. Together they catch what formal techniques miss.</p></div>`
    },
    { id:'4_5', num:'4.5.1', title:'Collaborative User Story Writing', content:`
<div class="section-tag">Section 4.5.1 — FL-4.5.1 (K2)</div>
<h2>Collaborative User Story Writing</h2>
<p class="intro-text">Collaboration-based approaches go beyond defect detection — they focus on <em>defect avoidance</em> by getting developers, testers, and business representatives to agree on requirements before a single line of code is written.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Instead of each architect, builder, and interior designer working from their own version of the plans, they sit down together and co-write the blueprint until all three agree it's complete, clear, and buildable. Collaborative user story writing is exactly that.</p></div>
<div class="info-block"><h3>What is a User Story?</h3><p>A user story represents a <strong>feature that will be valuable to a user or purchaser</strong> of the software. The most common format:<br><br><em>"As a [role], I want [goal to be accomplished], so that I can [resulting business value]."</em><br><br>Followed by acceptance criteria.</p></div>
<div class="info-block blue"><h3>The 3 C's of a User Story (Jeffries 2000)</h3><div class="cards-grid"><div class="card"><div class="card-icon">🃏</div><h4>Card</h4><p>The medium describing the story — an index card, electronic board entry. Keeps it short and focused.</p></div><div class="card"><div class="card-icon">💬</div><h4>Conversation</h4><p>Explains how the software will be used. Can be documented or verbal. The discussion that fills in the details.</p></div><div class="card"><div class="card-icon">✅</div><h4>Confirmation</h4><p>The acceptance criteria — how the team confirms the story is done correctly.</p></div></div></div>
<div class="info-block"><h3>INVEST — Qualities of a Good User Story (Wake 2003)</h3><p>
<strong>I</strong>ndependent — can be developed and tested without depending on other stories<br>
<strong>N</strong>egotiable — not a rigid contract; open to discussion and refinement<br>
<strong>V</strong>aluable — delivers value to a user or stakeholder<br>
<strong>E</strong>stimable — the team can estimate its size and effort<br>
<strong>S</strong>mall — fits within one iteration; not too large to be tracked<br>
<strong>T</strong>estable — acceptance criteria exist; if a stakeholder can't describe how to test it, the story is unclear
</p></div>
<div class="info-block yellow"><h3>📌 Tester's Role in Story Writing</h3><p>Testers <strong>ask the right questions</strong> — they explore, challenge, and help improve the proposed user stories. Techniques used: <strong>brainstorming and mind mapping</strong>. The goal: achieve a <strong>shared vision</strong> from three perspectives — business, development, and testing. If a stakeholder can't describe how to test a user story, it signals the story is unclear OR not truly valuable.</p></div>`
    },
    { id:'4_5b', num:'4.5.2', title:'Acceptance Criteria', content:`
<div class="section-tag">Section 4.5.2 — FL-4.5.2 (K2)</div>
<h2>Acceptance Criteria</h2>
<p class="intro-text">Acceptance criteria are the concrete conditions that an implementation must satisfy to be accepted by stakeholders. They transform a vague user story into a verifiable specification.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A user story says "I want a table that seats 6 and looks good in my dining room." Acceptance criteria spell it out: "Must seat 6 adults, must be rectangular, must be under 180cm long, must be made of wood, must match the existing decor color scheme." Now both the builder and buyer know exactly what success looks like.</p></div>
<div class="info-block"><h3>What Are Acceptance Criteria Used For?</h3><p>• Define the <strong>scope</strong> of the user story<br>• Reach <strong>consensus</strong> among stakeholders<br>• Describe both <strong>positive and negative scenarios</strong><br>• Serve as the basis for <strong>acceptance testing</strong><br>• Allow accurate <strong>planning and estimation</strong></p></div>
<div class="cards-grid"><div class="card"><div class="card-icon">📖</div><h4>Scenario-Oriented Format</h4><p>Uses <strong>Given / When / Then</strong> — the BDD format. Readable by everyone on the team.<br><br><em>Given</em> a logged-in user,<br><em>When</em> they click "Delete Account",<br><em>Then</em> a confirmation dialog appears.</p></div><div class="card"><div class="card-icon">📋</div><h4>Rule-Oriented Format</h4><p>A bullet point verification list or a tabulated input-output mapping.<br><br>• Password must be 8+ characters<br>• Must contain at least one uppercase letter<br>• Must contain at least one number</p></div></div>
<div class="info-block yellow"><h3>📌 Exam Point</h3><p>These two formats (scenario-oriented and rule-oriented) are the most common, but teams may use <strong>custom formats</strong> — as long as criteria are <strong>well-defined and unambiguous</strong>. Acceptance criteria are typically the result of the <strong>Conversation</strong> (the second C in the 3 C's of user stories).</p></div>`
    },
    { id:'4_5c', num:'4.5.3', title:'ATDD — Acceptance Test-Driven Dev', content:`
<div class="section-tag">Section 4.5.3 — FL-4.5.3 (K3)</div>
<h2>Acceptance Test-Driven Development (ATDD)</h2>
<p class="intro-text">ATDD is a test-first approach where test cases are created BEFORE implementing the user story. It's collaboration in action — turning acceptance criteria into executable tests that drive development.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Before writing a textbook chapter, the teacher writes the exam first. Every section of the chapter is written to ensure students can pass the exam. ATDD works the same way — the acceptance tests are the exam; the code is the textbook written to pass it.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot">👥</div><div class="flow-content"><h4>Step 1 — Specification Workshop</h4><p>The whole team (customers, developers, testers) analyzes, discusses, and writes the user story and acceptance criteria together. Incompleteness, ambiguities, and defects in the story are resolved <em>before</em> coding begins.</p></div></div>
<div class="flow-step"><div class="flow-dot">📝</div><div class="flow-content"><h4>Step 2 — Create Test Cases</h4><p>Test cases are written based on acceptance criteria — they become <em>examples of how the software should work</em>. Can be done by the whole team or by testers individually. Test techniques from sections 4.2, 4.3, and 4.4 may all be applied.</p></div></div>
<div class="flow-step"><div class="flow-dot">✅</div><div class="flow-content"><h4>Step 3 — Positive Tests First</h4><p>Start with the happy path — confirming correct behavior without exceptions. This covers the main flow everyone expects to work.</p></div></div>
<div class="flow-step"><div class="flow-dot">❌</div><div class="flow-content"><h4>Step 4 — Negative Testing</h4><p>After positive tests, add negative tests — error conditions, boundary violations, unexpected inputs. These are just as important as the happy path.</p></div></div>
<div class="flow-step"><div class="flow-dot">📊</div><div class="flow-content"><h4>Step 5 — Non-Functional Coverage</h4><p>Finally, cover non-functional quality characteristics — performance, usability, security — that the story also must satisfy.</p></div></div>
<div class="flow-step"><div class="flow-dot">🤖</div><div class="flow-content"><h4>Step 6 — Automate (Optional)</h4><p>When captured in a format supported by a test automation framework, developers write supporting code to automate the tests. The acceptance tests become <strong>executable requirements</strong>.</p></div></div>
</div>
<div class="info-block"><h3>Rules for ATDD Test Cases</h3><p>• Tests must <strong>cover all characteristics</strong> of the user story<br>• Tests must <strong>NOT go beyond</strong> the story scope<br>• <strong>No two test cases</strong> should describe the same characteristics<br>• Tests should be expressed in <strong>natural language</strong> understandable to all stakeholders (preconditions, inputs, postconditions)</p></div>
<div class="info-block yellow"><h3>📌 "Examples" = "Tests" in ATDD</h3><p>In ATDD, the terms "examples" and "test cases" are often used interchangeably — because the examples of how the software works ARE the tests. This is the connection between ATDD and BDD (Given/When/Then examples become executable tests).</p></div>`
    },
  ]
},

    { id:'5_1', num:'5.1.1', title:'Test Plan — Purpose & Content', content:`
<div class="section-tag">Section 5.1.1 — FL-5.1.1 (K2)</div>
<h2>Purpose and Content of a Test Plan</h2>
<p class="intro-text">A test plan is the master document that describes <em>what</em> you will test, <em>how</em> you will test it, <em>when</em>, and <em>who</em> will do it. Think of it as the testing team's contract with the project.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A test plan is like a <strong>military operation order</strong>. It defines the mission (objectives), the territory (scope), the troops and resources, the timeline, the rules of engagement (strategy), the communication plan, and the conditions for declaring victory (exit criteria). Without it, everyone's operating on assumptions.</p></div>
<div class="info-block blue"><h3>What Does a Test Plan Do?</h3>
<p>📄 <strong>Documents</strong> the means and schedule for achieving test objectives.</p>
<p>✅ <strong>Ensures</strong> test activities meet the established criteria.</p>
<p>💬 <strong>Communicates</strong> the testing approach to team members and stakeholders.</p>
<p>🏛️ <strong>Demonstrates</strong> that testing will adhere to the existing test policy and test strategy — or explains why it deviates.</p>
<p>🧠 <strong>Forces testers to think ahead</strong> — confronting risks, schedules, people, tools, costs, and effort before they become problems.</p></div>
<div class="info-block"><h3>📋 Typical Contents of a Test Plan (Know All of These!)</h3>
<table class="compare"><thead><tr><th>Section</th><th>What It Covers</th></tr></thead><tbody>
<tr><td><strong>Context of Testing</strong></td><td>Test scope, test objectives, test basis (requirements, standards, risks)</td></tr>
<tr><td><strong>Assumptions & Constraints</strong></td><td>What we're assuming is true; what limits our testing</td></tr>
<tr><td><strong>Stakeholders</strong></td><td>Roles, responsibilities, relevance to testing, hiring/training needs</td></tr>
<tr><td><strong>Communication</strong></td><td>Forms and frequency of communication, documentation templates</td></tr>
<tr><td><strong>Risk Register</strong></td><td>Identified product risks and project risks</td></tr>
<tr><td><strong>Test Approach</strong></td><td>Test levels, test types, techniques, deliverables, entry/exit criteria, independence of testing, metrics to collect, test data and environment requirements, deviations from strategy</td></tr>
<tr><td><strong>Budget & Schedule</strong></td><td>Cost and timeline for all test activities</td></tr>
</tbody></table></div>
<div class="info-block yellow"><h3>📌 Exam Tip — ISO Standard Reference</h3><p>The ISTQB syllabus points to <strong>ISO/IEC/IEEE 29119-3</strong> for detailed test plan templates and examples. You don't need to memorize the standard itself, but knowing it exists and what it covers may appear in exam questions.</p></div>`
    },
    { id:'5_1b', num:'5.1.2', title:'Tester\'s Role in Iteration & Release Planning', content:`
<div class="section-tag">Section 5.1.2 — FL-5.1.2 (K1)</div>
<h2>Tester's Contribution to Iteration and Release Planning</h2>
<p class="intro-text">In Agile and iterative projects, planning happens at two levels: the big-picture release and the short-cycle iteration. Testers actively contribute to both — they're not just passive recipients of a work schedule.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine planning a multi-stop road trip. <strong>Release planning</strong> = deciding which cities to visit and in what order for the whole trip. <strong>Iteration planning</strong> = figuring out exactly how to navigate each day's leg, including rest stops and fuel. A smart navigator (tester) is essential to both levels.</p></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">🗓️</div>
  <h4>Release Planning — Big Picture</h4>
  <p>Looks ahead to the <strong>entire product release</strong>. Defines and refines the product backlog. Testers:<br>• Write testable user stories and acceptance criteria<br>• Participate in quality risk analysis<br>• Estimate test effort for user stories<br>• Determine the test approach<br>• Plan testing across all iterations</p>
</div>
<div class="card blue">
  <div class="card-icon">🔄</div>
  <h4>Iteration Planning — Sprint Detail</h4>
  <p>Looks ahead to the <strong>end of one sprint/iteration</strong>. Concerned with the iteration backlog. Testers:<br>• Perform detailed risk analysis of user stories<br>• Determine testability of each story<br>• Break stories into testing tasks<br>• Estimate effort for each testing task<br>• Identify functional AND non-functional aspects to test</p>
</div>
</div>
<div class="info-block yellow"><h3>📌 Exam Key Point</h3><p>Testers are <strong>active participants</strong> in planning, not just order-takers. Their most important contribution at the planning stage is ensuring user stories are <strong>testable</strong> before any code is written — catching vague or unmeasurable requirements early.</p></div>`
    },
    { id:'5_1c', num:'5.1.3', title:'Entry Criteria & Exit Criteria', content:`
<div class="section-tag">Section 5.1.3 — FL-5.1.3 (K2)</div>
<h2>Entry Criteria and Exit Criteria</h2>
<p class="intro-text">These are the gatekeepers of testing. Entry criteria control when you <em>start</em> — exit criteria define when you're <em>done</em>.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Entry criteria are like the conditions before a surgeon starts an operation: patient vitals stable, instruments sterilized, team present, anesthesia administered. Exit criteria are the conditions before the patient leaves recovery: vitals normal, incision sealed, no complications. Meeting these criteria isn't optional — skipping them creates risk.</p></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">🚪</div>
  <h4>Entry Criteria — "Before We Start"</h4>
  <p>Define preconditions for undertaking testing. If not met, testing will be harder, slower, costlier, and riskier.<br><br>
  <strong>Typical examples:</strong><br>
  • People, tools, environments, test data, budget, and time are available<br>
  • Test basis (requirements, user stories, test cases) is available<br>
  • Initial quality check passed (e.g., smoke tests passed)</p>
</div>
<div class="card blue">
  <div class="card-icon">🏁</div>
  <h4>Exit Criteria — "We're Done When..."</h4>
  <p>Define what must be achieved to declare an activity complete.<br><br>
  <strong>Thoroughness measures:</strong><br>
  • Coverage level achieved<br>
  • Number of unresolved defects / defect density<br>
  • Number of failed test cases<br><br>
  <strong>Binary yes/no criteria:</strong><br>
  • Planned tests executed<br>
  • All defects reported<br>
  • All regression tests automated</p>
</div>
</div>
<div class="info-block red"><h3>⚠️ Time/Budget as Valid Exit Criteria</h3><p>Running out of time or budget can also be a valid exit criterion — even if other criteria aren't fully met. This is acceptable IF stakeholders have reviewed and accepted the risk of going live under these conditions. Testing stops; risk is documented and accepted.</p></div>
<div class="info-block blue"><h3>Agile Equivalents — Definition of Ready & Definition of Done</h3><p>In Agile development:</p><p>✅ <strong>Definition of Done (DoD)</strong> = exit criteria. Objective metrics a team uses to declare a user story releasable. Every story must pass the DoD before it's "done."</p><p>✅ <strong>Definition of Ready (DoR)</strong> = entry criteria. The conditions a user story must fulfill <em>before</em> development (and testing) begins on it.</p></div>`
    },
    { id:'5_1d', num:'5.1.4', title:'Estimation Techniques', content:`
<div class="section-tag">Section 5.1.4 — FL-5.1.4 (K3)</div>
<h2>Test Effort Estimation Techniques</h2>
<p class="intro-text">How long will testing take? How many person-days do we need? Estimation is never perfect — but using the right technique gets you much closer than guessing.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Estimating test effort is like a contractor estimating a renovation. They use past project costs (ratios), measure current work and scale (extrapolation), consult with multiple experienced tradespeople (Wideband Delphi), or ask for a best-case, worst-case, and most-likely-case figure (three-point estimation). No single method is perfect — each has its place.</p></div>
<div class="info-block yellow"><h3>⚠️ Important Caveat — Always Communicate This!</h3><p>Estimates are based on <strong>assumptions</strong> and are always subject to <strong>estimation error</strong>. Stakeholders must understand this. Also: estimating a large task as a whole is less accurate — <strong>break large tasks into smaller ones</strong> first, then estimate each piece.</p></div>
<div class="term-list">
<div class="term">
  <div class="term-name">📊 Estimation Based on Ratios</div>
  <div class="term-def"><strong>Metrics-based.</strong> Uses historical data from past projects to derive standard ratios. Example: if your organization's development-to-test ratio is consistently 3:2, and development effort is 600 person-days, test effort = 400 person-days. Best ratios come from your own organization's data.</div>
</div>
<div class="term">
  <div class="term-name">📈 Extrapolation</div>
  <div class="term-def"><strong>Metrics-based.</strong> Collect measurements early in the current project, then use a mathematical model to project remaining effort. Very suitable for iterative SDLCs. Example: average effort from the last 3 sprints = estimate for next sprint.</div>
</div>
<div class="term">
  <div class="term-name">🎯 Wideband Delphi</div>
  <div class="term-def"><strong>Expert-based, iterative.</strong> Experts estimate independently → results collected → outliers discuss their reasoning → re-estimate independently → repeat until consensus. <strong>Planning Poker</strong> is a Wideband Delphi variant used in Agile, using numbered cards to represent effort size.</div>
</div>
<div class="term">
  <div class="term-name">🔢 Three-Point Estimation</div>
  <div class="term-def"><strong>Expert-based.</strong> Experts give three values: optimistic (a), most likely (m), pessimistic (b). Final estimate: <strong>E = (a + 4×m + b) / 6</strong>. Measurement error: <strong>SD = (b – a) / 6</strong>.<br><br>Example: a=6, m=9, b=18 → E = (6 + 36 + 18)/6 = 10. SD = (18–6)/6 = 2. Result: <strong>10 ± 2 person-hours</strong>.</div>
</div>
</div>
<div class="info-block"><h3>📌 Planning Poker — How It Works</h3><p>Each team member has cards with numbers (like Fibonacci: 1, 2, 3, 5, 8, 13, 21). Everyone simultaneously reveals their estimate. If there are large differences, those who chose extreme values explain their reasoning. Then estimate again. Repeat until the team converges on an estimate.</p></div>`
    },
    { id:'5_1e', num:'5.1.5', title:'Test Case Prioritization', content:`
<div class="section-tag">Section 5.1.5 — FL-5.1.5 (K3)</div>
<h2>Test Case Prioritization</h2>
<p class="intro-text">You have 500 test cases but only time to run 300. Which 300? Prioritization decides the execution order so that the most important tests always run first.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A hospital triage system doesn't treat patients on a first-come-first-served basis. It prioritizes by severity: critical first, then urgent, then stable. Test case prioritization is exactly this — the most critical tests run first so that if time runs out, we've already found the most important problems.</p></div>
<div class="cards-grid three">
<div class="card highlight">
  <div class="card-icon">🎲</div>
  <h4>Risk-Based Prioritization</h4>
  <p>Order tests based on <strong>risk analysis results</strong>. Highest-risk features first. If time runs out, you've already tested what matters most.</p>
</div>
<div class="card blue">
  <div class="card-icon">📊</div>
  <h4>Coverage-Based Prioritization</h4>
  <p>Order tests to <strong>achieve maximum code/requirements coverage</strong> first. Variant: <strong>Additional Coverage</strong> — each next test adds the most new coverage to what's already covered.</p>
</div>
<div class="card yellow">
  <div class="card-icon">📋</div>
  <h4>Requirements-Based Prioritization</h4>
  <p>Order tests based on <strong>stakeholder-defined requirement priorities</strong>. Most important requirements → their tests run first.</p>
</div>
</div>
<div class="info-block red"><h3>⚠️ Dependencies Can Override Priority Order</h3><p>If a high-priority test case depends on a low-priority one (e.g., you can't test "checkout" without first testing "add to cart"), the lower-priority test MUST run first — regardless of its priority rank. Dependencies always constrain the ideal execution order.</p></div>
<div class="info-block"><h3>Also Consider: Resource Availability</h3><p>Test execution order must account for when specific tools, environments, or people are available. A test requiring a specific test environment can only run when that environment is ready — even if it's high priority.</p></div>`
    },
    { id:'5_1f', num:'5.1.6–5.1.7', title:'Test Pyramid & Testing Quadrants', content:`
<div class="section-tag">Sections 5.1.6 & 5.1.7 — FL-5.1.6 (K1) / FL-5.1.7 (K2)</div>
<h2>Test Pyramid & Testing Quadrants</h2>
<p class="intro-text">Two visual models that help teams make smart decisions about <em>how much</em> of each test type to have and <em>where</em> each type belongs in the project.</p>
<div class="analogy"><div class="analogy-label">Analogy — Test Pyramid</div><p>Think of a building's foundation. A skyscraper needs a massive, deep foundation (lots of unit tests), moderate middle floors (integration tests), and a relatively small penthouse at the top (end-to-end tests). If you invert this — small foundation, massive top — the building is unstable and expensive to maintain.</p></div>
<div class="info-block blue"><h3>🔺 The Test Pyramid</h3>
<div style="display:flex;flex-direction:column;align-items:center;gap:0;margin:12px 0 16px;">
  <div style="background:rgba(248,113,113,0.15);border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:10px 20px;text-align:center;width:280px;">
    <div style="font-size:12px;color:var(--warn);font-weight:700;font-family:'Syne',sans-serif;">TOP — FEW TESTS</div>
    <div style="font-size:13px;color:var(--text);">E2E / UI Tests — Slow, costly, broad scope</div>
  </div>
  <div style="width:2px;height:10px;background:var(--border);"></div>
  <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:10px 30px;text-align:center;width:340px;">
    <div style="font-size:12px;color:var(--accent3);font-weight:700;font-family:'Syne',sans-serif;">MIDDLE — MODERATE TESTS</div>
    <div style="font-size:13px;color:var(--text);">Integration / Service Tests — Medium speed</div>
  </div>
  <div style="width:2px;height:10px;background:var(--border);"></div>
  <div style="background:rgba(74,240,168,0.1);border:1px solid rgba(74,240,168,0.3);border-radius:8px;padding:10px 40px;text-align:center;width:420px;">
    <div style="font-size:12px;color:var(--accent);font-weight:700;font-family:'Syne',sans-serif;">BOTTOM — MANY TESTS</div>
    <div style="font-size:13px;color:var(--text);">Unit / Component Tests — Fast, isolated, cheap</div>
  </div>
</div>
<p>Higher layer = lower granularity + lower isolation + higher execution time. Bottom tests are fast, small, and plentiful. Top tests are slow, complex, and few.</p></div>
<div class="info-block"><h3>🔲 The Testing Quadrants (Brian Marick)</h3>
<p style="margin-bottom:12px;">Tests can be <strong>business-facing</strong> or <strong>technology-facing</strong>. They can <strong>support the team</strong> (guide development) or <strong>critique the product</strong> (measure behavior against expectations). These two axes create four quadrants:</p>
<table class="compare"><thead><tr><th>Quadrant</th><th>Facing</th><th>Purpose</th><th>Test Types</th><th>Automation?</th></tr></thead><tbody>
<tr><td><span class="tag-g">Q1</span></td><td>Technology</td><td>Support team</td><td>Component tests, component integration tests</td><td>✅ Automated, in CI</td></tr>
<tr><td><span class="tag-b">Q2</span></td><td>Business</td><td>Support team</td><td>Functional tests, user story tests, examples, API tests, simulations</td><td>✅ Manual or automated</td></tr>
<tr><td><span class="tag-y">Q3</span></td><td>Business</td><td>Critique product</td><td>Exploratory, usability, user acceptance testing</td><td>🙋 Mostly manual</td></tr>
<tr><td><span class="tag-r">Q4</span></td><td>Technology</td><td>Critique product</td><td>Smoke tests, non-functional tests (except usability)</td><td>✅ Often automated</td></tr>
</tbody></table></div>
<div class="info-block yellow"><h3>📌 Why Quadrants Matter</h3><p>The quadrant model helps managers ensure <strong>all test types are included</strong> in the SDLC — nothing gets overlooked. It also helps explain testing to non-testers (developers, business reps) in terms they understand.</p></div>`
    },
    { id:'5_2', num:'5.2', title:'Risk Management', content:`
<div class="section-tag">Section 5.2 — FL-5.2.1 to FL-5.2.4 (K1/K2)</div>
<h2>Risk Management</h2>
<p class="intro-text">We can't test everything. Risk management helps us focus testing where it matters most — increasing the likelihood of catching the most damaging defects first.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>An airport security team can't give every passenger a full body scan. They prioritize based on risk signals — origin, behavior, flags. Same principle in testing: test more intensively where the risk of failure is highest and the impact would be greatest.</p></div>
<div class="info-block"><h3>What is Risk?</h3><p><strong>Risk</strong> = a potential event whose occurrence causes an adverse effect. Every risk has two attributes:</p><p>🎲 <strong>Risk Likelihood</strong> — probability of the risk occurring (between 0 and 1, exclusive)<br>💥 <strong>Risk Impact</strong> — consequences if it occurs<br><br><strong>Risk Level = Likelihood × Impact</strong><br>The higher the risk level, the more important it is to address it.</p></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">🏢</div>
  <h4>Product Risks</h4>
  <p>Related to <strong>product quality</strong> (ISO 25010). Examples:<br>• Missing or wrong functionality<br>• Incorrect calculations<br>• Runtime errors<br>• Poor architecture<br>• Inadequate response time<br>• Security vulnerabilities<br>• Poor user experience<br><br>Consequences: user dissatisfaction, revenue loss, damage to third parties, criminal penalties, even physical harm.</p>
</div>
<div class="card red">
  <div class="card-icon">📋</div>
  <h4>Project Risks</h4>
  <p>Related to <strong>project management and control</strong>. Examples:<br>• Organizational: delays, cost cutting, inaccurate estimates<br>• People: skill gaps, conflicts, staff shortage<br>• Technical: scope creep, poor tool support<br>• Supplier: third-party delivery failure, vendor bankruptcy<br><br>Consequences: project schedule, budget, or scope impacted.</p>
</div>
</div>
<div class="flow">
<div class="flow-step"><div class="flow-dot">🔍</div><div class="flow-content"><h4>Risk Identification</h4><p>Generate a comprehensive list of risks using: brainstorming, workshops, interviews, cause-effect diagrams. Involve stakeholders — they know where things can go wrong.</p></div></div>
<div class="flow-step"><div class="flow-dot">📊</div><div class="flow-content"><h4>Risk Assessment</h4><p>For each risk: categorize, assess likelihood and impact, determine risk level, prioritize. Can use quantitative (Likelihood × Impact) or qualitative (risk matrix) approach.</p></div></div>
<div class="flow-step"><div class="flow-dot">🎯</div><div class="flow-content"><h4>Risk Mitigation (Control)</h4><p>Implement actions to reduce risk. Options: mitigate by testing more, accept the risk, transfer it (insurance), or create a contingency plan. Mitigation actions include: experienced testers, independence of testing, reviews, static analysis, appropriate test techniques.</p></div></div>
<div class="flow-step"><div class="flow-dot">📈</div><div class="flow-content"><h4>Risk Monitoring</h4><p>Ensure mitigation actions are effective. Identify emerging risks. Update risk levels as testing progresses and new information becomes available.</p></div></div>
</div>
<div class="info-block blue"><h3>How Product Risk Analysis Influences Testing</h3><p>Results of product risk analysis are used to:</p><p>• <strong>Determine test scope</strong> — what gets tested at all<br>• <strong>Determine test levels and types</strong> — where to test and how<br>• <strong>Select test techniques and coverage levels</strong><br>• <strong>Estimate effort</strong> — high-risk = more time<br>• <strong>Prioritize</strong> — find critical defects early<br>• <strong>Decide if non-testing activities</strong> are needed (e.g., reviews, audits)</p></div>`
    },
    { id:'5_3', num:'5.3', title:'Test Monitoring, Control & Completion', content:`
<div class="section-tag">Section 5.3 — FL-5.3.1 to FL-5.3.3 (K1/K2)</div>
<h2>Test Monitoring, Control and Test Completion</h2>
<p class="intro-text">Testing must be tracked, managed, and communicated — not just executed and forgotten. These three activities keep testing on course and meaningful.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Think of a ship's navigation system. <strong>Monitoring</strong> = checking GPS, speed, heading, weather. <strong>Control</strong> = adjusting course when you're off track. <strong>Completion</strong> = docking and logging the voyage for future captains. All three are essential.</p></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">📡</div>
  <h4>Test Monitoring</h4>
  <p>Gather information about testing to assess progress and whether exit criteria are being met. Are we on schedule? Is coverage being achieved? Are risks decreasing?</p>
</div>
<div class="card blue">
  <div class="card-icon">🎮</div>
  <h4>Test Control</h4>
  <p>Use monitoring data to provide corrective action directives. Examples:<br>• Reprioritize tests when risk becomes an issue<br>• Re-evaluate entry/exit criteria due to rework<br>• Adjust schedule due to environment delays<br>• Add resources where needed</p>
</div>
<div class="card yellow">
  <div class="card-icon">🏁</div>
  <h4>Test Completion</h4>
  <p>Collect data from completed activities to consolidate experience and testware. Occurs at: end of test level, end of iteration, project completion/cancellation, release, or maintenance release.</p>
</div>
</div>
<div class="info-block"><h3>📊 Common Test Metrics — Know These Categories!</h3>
<table class="compare"><thead><tr><th>Metric Category</th><th>Examples</th></tr></thead><tbody>
<tr><td><span class="tag-g">Project Progress</span></td><td>Task completion rate, resource usage, test effort consumed</td></tr>
<tr><td><span class="tag-b">Test Progress</span></td><td>Test cases implemented/run/passed/failed, environment prep progress, test execution time</td></tr>
<tr><td><span class="tag-y">Product Quality</span></td><td>Availability, response time, mean time to failure</td></tr>
<tr><td><span class="tag-r">Defect Metrics</span></td><td>Defects found/fixed, defect density, defect detection percentage, priorities of open defects</td></tr>
<tr><td><span class="tag-p">Risk Metrics</span></td><td>Residual risk level</td></tr>
<tr><td><span class="tag-g">Coverage Metrics</span></td><td>Requirements coverage %, code coverage %</td></tr>
<tr><td><span class="tag-b">Cost Metrics</span></td><td>Cost of testing, organizational cost of quality</td></tr>
</tbody></table></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">📊</div>
  <h4>Test Progress Report</h4>
  <p>Created <strong>regularly during testing</strong> (daily, weekly). Supports ongoing test control. Includes: testing period, progress vs. schedule, impediments & workarounds, metrics, new/changed risks, what's planned next. Audience: team members.</p>
</div>
<div class="card blue">
  <div class="card-icon">📄</div>
  <h4>Test Completion Report</h4>
  <p>Created <strong>at the end</strong> of a test level, type, or project. Includes: test summary, evaluation vs. test objectives, deviations from plan, impediments, metrics, unmitigated risks, lessons learned. Audience: management and stakeholders.</p>
</div>
</div>
<div class="info-block blue"><h3>Communicating Test Status</h3><p>Options include: verbal communication, dashboards (CI/CD dashboards, burn-down charts, task boards), email/chat, online documentation, formal test reports. The best approach depends on team structure, regulatory requirements, and stakeholder preferences. Distributed teams often need more formal written communication.</p></div>`
    },
    { id:'5_4', num:'5.4', title:'Configuration Management', content:`
<div class="section-tag">Section 5.4 — FL-5.4.1 (K2)</div>
<h2>Configuration Management</h2>
<p class="intro-text">Configuration management (CM) is the discipline of tracking and controlling every piece of the testing puzzle — so you always know exactly what you tested, with what, and when.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>Imagine running a test, finding a critical bug, and not being able to reproduce it — because you don't know which version of the code you tested or which version of the test script you used. Configuration management prevents this chaos entirely. It's the difference between "I found a bug" and "I found a bug in build v2.3.1 using test script TS-045 on environment CONFIG-A."</p></div>
<div class="info-block"><h3>What Does CM Track in Testing?</h3><p>CM provides a discipline for identifying, controlling, and tracking these work products as <strong>configuration items</strong>:</p>
<p>
  <span class="tag-g">Test Plans</span> &nbsp;
  <span class="tag-g">Test Strategies</span> &nbsp;
  <span class="tag-b">Test Conditions</span> &nbsp;
  <span class="tag-b">Test Cases</span> &nbsp;
  <span class="tag-y">Test Scripts</span> &nbsp;
  <span class="tag-y">Test Results</span> &nbsp;
  <span class="tag-r">Test Logs</span> &nbsp;
  <span class="tag-r">Test Reports</span>
</p></div>
<div class="cards-grid">
<div class="card highlight">
  <div class="card-icon">🆔</div>
  <h4>Unique Identification</h4>
  <p>Every configuration item is uniquely identified and version controlled. You always know exactly which version of a test script produced which result.</p>
</div>
<div class="card blue">
  <div class="card-icon">🔗</div>
  <h4>Traceability</h4>
  <p>All identified documentation and software items are referenced unambiguously in testware. Test results trace to test cases, which trace to requirements, which trace to risks.</p>
</div>
<div class="card yellow">
  <div class="card-icon">📸</div>
  <h4>Baselines</h4>
  <p>When a configuration item is approved for testing, it becomes a <strong>baseline</strong> — it can only be changed via a formal change control process. Previous baselines can be restored to reproduce past results.</p>
</div>
<div class="card">
  <div class="card-icon">🔄</div>
  <h4>Complex Item Recording</h4>
  <p>For complex items (e.g., a test environment), CM records all components, their relationships, and versions. Full transparency of what an environment consists of.</p>
</div>
</div>
<div class="info-block blue"><h3>CM in DevOps/CI/CD</h3><p>In modern DevOps pipelines, CM is typically <strong>automated</strong>. Continuous integration, delivery, and deployment pipelines have automated CM built in — every commit, build, and test run is tracked automatically, with version histories maintained without manual effort.</p></div>`
    },
    { id:'5_5', num:'5.5', title:'Defect Management', content:`
<div class="section-tag">Section 5.5 — FL-5.5.1 (K3)</div>
<h2>Defect Management</h2>
<p class="intro-text">Finding a bug is only half the battle. The other half is managing it — documenting it clearly, tracking it to resolution, and ensuring it never gets lost in the chaos.</p>
<div class="analogy"><div class="analogy-label">Analogy</div><p>A hospital doesn't treat patients and then forget about them. Every patient gets a file: symptoms recorded, diagnosis made, treatment assigned, progress tracked, and discharged only when fully treated. Defect management is the same — every bug gets a "file" from discovery to closure, with full traceability throughout.</p></div>
<div class="info-block yellow"><h3>⚠️ Important Nuance — Anomalies ≠ Defects</h3><p>The reported anomaly may turn out to be an actual defect — OR it could be a false positive, a misunderstanding, or a change request. This is resolved <em>during</em> the defect management process. Every anomaly gets logged; not every anomaly is a defect that needs a fix.</p></div>
<div class="flow">
<div class="flow-step"><div class="flow-dot">🔍</div><div class="flow-content"><h4>Detection & Logging</h4><p>Anomaly found (during any SDLC phase). Logged immediately with all available details. The defect management workflow begins.</p></div></div>
<div class="flow-step"><div class="flow-dot">📊</div><div class="flow-content"><h4>Analysis & Classification</h4><p>Is it a real defect? What is its severity? Which component is affected? Who owns it? What's the priority?</p></div></div>
<div class="flow-step"><div class="flow-dot">🎯</div><div class="flow-content"><h4>Decision</h4><p>Fix it? Defer it to next release? Accept it as a known limitation? Reject it (not a bug, working as designed)?</p></div></div>
<div class="flow-step"><div class="flow-dot">🔧</div><div class="flow-content"><h4>Fix & Confirmation Test</h4><p>Developer fixes; tester re-runs to confirm resolution. If confirmed: close. If not: reopen.</p></div></div>
<div class="flow-step"><div class="flow-dot">✅</div><div class="flow-content"><h4>Closure</h4><p>Defect is formally closed. Metrics collected. Lessons feed process improvement.</p></div></div>
</div>
<div class="info-block"><h3>📋 What Goes Into a Good Defect Report?</h3>
<table class="compare"><thead><tr><th>Field</th><th>What to Include</th></tr></thead><tbody>
<tr><td><span class="tag-g">Unique Identifier</span></td><td>Auto-generated ID for tracking (e.g., DEF-0042)</td></tr>
<tr><td><span class="tag-g">Title / Summary</span></td><td>Short, clear description of the anomaly</td></tr>
<tr><td><span class="tag-b">Date & Author</span></td><td>When found, who found it, their role, organization</td></tr>
<tr><td><span class="tag-b">Test Object & Environment</span></td><td>Which build, which environment, which config</td></tr>
<tr><td><span class="tag-y">Context</span></td><td>Test case being run, test activity, SDLC phase, technique used, test data</td></tr>
<tr><td><span class="tag-y">Steps to Reproduce</span></td><td>Exact numbered steps. Add logs, screenshots, DB dumps, recordings</td></tr>
<tr><td><span class="tag-r">Expected vs. Actual Result</span></td><td>What should happen vs. what actually happened</td></tr>
<tr><td><span class="tag-r">Severity</span></td><td>Degree of impact on stakeholders / requirements</td></tr>
<tr><td><span class="tag-p">Priority</span></td><td>How urgently this must be fixed</td></tr>
<tr><td><span class="tag-p">Status</span></td><td>Open / Deferred / Duplicate / Waiting to fix / Awaiting confirmation / Re-opened / Closed / Rejected</td></tr>
</tbody></table></div>
<div class="info-block yellow"><h3>📌 Severity vs. Priority — The Classic Exam Trap!</h3><p><strong>Severity</strong> = technical impact. How bad is the damage if this defect occurs?<br><strong>Priority</strong> = business urgency. How soon must this be fixed?<br><br>These are <strong>independent</strong>:<br>• <span class="tag-r">High severity, Low priority:</span> System crashes if a user types a 500-character name in an internal admin tool used twice a year.<br>• <span class="tag-g">Low severity, High priority:</span> Company logo is spelled wrong on the homepage — embarrassing but not functionally broken.</p></div>
<div class="info-block blue"><h3>Where Does This Apply?</h3><p>Defect management applies to defects found during <strong>any SDLC phase</strong> — not just test execution. Defects found during static testing (reviews, static analysis) should be handled through the same defect management process, logged and tracked with the same rigour.</p></div>`
    },
  ]

    { id:'6_1', num:'6.1', title:'Tool Support for Testing', content:`
<div class="section-tag">Section 6.1 — FL-6.1.1 (K2)</div>
<h2>Tool Support for Testing</h2>
<p class="intro-text">Tools don't replace testers — they amplify them. They support and facilitate many test activities, making testing faster, more consistent, and more capable. But a tool is only as good as the person wielding it.</p>
<div class="analogy"><div class="analogy-label">Real-World Analogy</div><p>Think of test tools like kitchen appliances. A stand mixer doesn't bake the cake — the baker does. But it handles the repetitive, exhausting part (mixing) so the baker can focus on creative work (flavor, decoration). Test tools handle the repetitive and complex so testers can focus on thinking.</p></div>
<div class="info-block"><h3>What Do Test Tools Support?</h3><p>The ISTQB syllabus lists the following categories of tools that support testing. Note: <strong>any tool that assists in testing is a test tool</strong> — even a simple spreadsheet used to track test cases counts!</p></div>
<div class="cards-grid three">
  <div class="card"><div class="card-icon">📋</div><h4>Test Management Tools</h4><p>Increase efficiency by helping manage the full SDLC — requirements, tests, defects, and configurations. Examples: Jira, TestRail, Azure DevOps.</p></div>
  <div class="card"><div class="card-icon">🔍</div><h4>Static Testing Tools</h4><p>Support testers in performing reviews and static analysis — finding defects in code and documents <em>without running</em> the software. Examples: SonarQube, ESLint.</p></div>
  <div class="card"><div class="card-icon">🧪</div><h4>Test Design & Implementation Tools</h4><p>Facilitate generation of test cases, test data, and test procedures — reducing the time to build a solid test suite.</p></div>
  <div class="card"><div class="card-icon">⚡</div><h4>Test Execution & Coverage Tools</h4><p>Facilitate automated test execution and measure coverage (e.g., how much code was exercised). Examples: Selenium, JaCoCo, Istanbul.</p></div>
  <div class="card"><div class="card-icon">📈</div><h4>Non-Functional Testing Tools</h4><p>Allow testers to perform non-functional testing that is difficult or impossible to do manually — like simulating 10,000 concurrent users for performance testing. Examples: JMeter, k6, Gatling.</p></div>
  <div class="card"><div class="card-icon">🚀</div><h4>DevOps Tools</h4><p>Support the DevOps delivery pipeline: workflow tracking, automated build processes, CI/CD pipelines. Examples: Jenkins, GitHub Actions, GitLab CI.</p></div>
  <div class="card"><div class="card-icon">💬</div><h4>Collaboration Tools</h4><p>Facilitate communication between team members across testing activities. Examples: Confluence, Slack, Microsoft Teams.</p></div>
  <div class="card"><div class="card-icon">🖥️</div><h4>Scalability & Deployment Tools</h4><p>Support deployment standardization and testing environment management. Examples: Docker (containerization), virtual machines, Kubernetes.</p></div>
  <div class="card"><div class="card-icon">📊</div><h4>Any Other Assisting Tool</h4><p>Remember: even a <strong>spreadsheet</strong> is a test tool in the context of testing! Any tool that assists in testing qualifies.</p></div>
</div>
<div class="info-block blue"><h3>🧠 Memory Shortcut — 9 Tool Categories</h3><p>Management → Static → Design/Implementation → Execution/Coverage → Non-Functional → DevOps → Collaboration → Scalability/Deployment → Any assisting tool (spreadsheets, etc.)</p></div>
<div class="info-block yellow"><h3>📌 Exam Tip</h3><p>The exam may ask you to identify which type of tool supports a specific activity. Key distinction: <strong>static testing tools</strong> don't run code (they analyze it), while <strong>test execution tools</strong> do run code. A CI/CD pipeline tool = DevOps tool. A coverage report generator = test coverage tool.</p></div>`
    },
    { id:'6_2', num:'6.2', title:'Benefits & Risks of Test Automation', content:`
<div class="section-tag">Section 6.2 — FL-6.2.1 (K1)</div>
<h2>Benefits and Risks of Test Automation</h2>
<p class="intro-text">Simply buying a tool doesn't guarantee success. Each new tool requires effort — for introduction, maintenance, and training. There are real benefits AND real risks. The exam expects you to know both sides cold.</p>
<div class="analogy"><div class="analogy-label">Real-World Analogy</div><p>Buying a high-end espresso machine doesn't automatically make you a barista. It takes training, maintenance, and the right beans. If you only use it to make instant coffee, it was a waste of money. Test automation is exactly the same — the value comes from how wisely you use and maintain it.</p></div>
<div class="divider"></div>
<h3>✅ Potential Benefits of Test Automation</h3>
<div class="cards-grid">
  <div class="card"><div class="card-icon">⏱️</div><h4>Time Saved on Repetitive Work</h4><p>Reduces manual, repetitive effort — like re-running regression tests, re-entering the same test data, or comparing expected vs. actual results every release cycle.</p></div>
  <div class="card"><div class="card-icon">🎯</div><h4>Prevents Simple Human Errors</h4><p>Greater consistency and repeatability. Tests are consistently derived from requirements, test data is created systematically, and tests run in the same order with the same frequency — every time.</p></div>
  <div class="card"><div class="card-icon">📊</div><h4>More Objective Assessment</h4><p>Provides measures too complicated for humans to calculate manually — such as precise code coverage percentages and complex execution metrics.</p></div>
  <div class="card"><div class="card-icon">📁</div><h4>Easier Access to Test Information</h4><p>Supports test management and reporting with statistics, graphs, and aggregated data about test progress, failure rates, and execution duration.</p></div>
  <div class="card"><div class="card-icon">⚡</div><h4>Reduced Test Execution Time</h4><p>Faster execution means earlier defect detection, faster feedback to developers, and faster time to market for the product.</p></div>
  <div class="card"><div class="card-icon">🧠</div><h4>More Time for Deeper Testing</h4><p>When automation handles the repetitive work, testers have more time to design new, deeper, and more effective test cases that require human creativity and judgment.</p></div>
</div>
<div class="divider"></div>
<h3>⚠️ Potential Risks of Test Automation</h3>
<div class="cards-grid">
  <div class="card"><div class="card-icon">🌈</div><h4>Unrealistic Expectations</h4><p>Overestimating what a tool can do — including its functionality and ease of use. "Once we automate, everything is solved!" is almost always wrong.</p></div>
  <div class="card"><div class="card-icon">💸</div><h4>Inaccurate Estimations</h4><p>Underestimating the time, cost, and effort needed to introduce a tool, maintain test scripts, and change existing manual test processes. Automation has ongoing costs.</p></div>
  <div class="card"><div class="card-icon">🔨</div><h4>Automating the Wrong Things</h4><p>Using a test tool when manual testing is more appropriate — like automating one-time tests, exploratory sessions, or frequently changing UI flows where maintenance would outweigh benefit.</p></div>
  <div class="card"><div class="card-icon">🤖</div><h4>Over-Relying on the Tool</h4><p>Ignoring the need for human critical thinking. "All tests green = all good" is a dangerous assumption. Automation only finds what it was programmed to find.</p></div>
  <div class="card"><div class="card-icon">🏢</div><h4>Vendor Dependency</h4><p>The tool vendor may go out of business, retire the tool, sell it to a different vendor, or provide poor support — leaving your test suite stranded.</p></div>
  <div class="card"><div class="card-icon">📂</div><h4>Open-Source Abandonment</h4><p>Open-source tools may be abandoned — no further updates, security fixes, or compatibility updates. Internal components may also require frequent updates as dependencies evolve.</p></div>
  <div class="card"><div class="card-icon">🔌</div><h4>Compatibility Issues</h4><p>The automation tool may not be compatible with the development platform, tech stack, or operating system in use.</p></div>
  <div class="card"><div class="card-icon">⚖️</div><h4>Regulatory Non-Compliance</h4><p>Choosing an unsuitable tool that does not comply with regulatory requirements or safety standards — a serious risk in healthcare, finance, and aviation.</p></div>
</div>
<div class="info-block red"><h3>🚨 The Core Exam Trap: "Automation = Quality"</h3><p>Many teams assume: "We have 80% automation — our quality is great." <strong>This is wrong.</strong> Automation only catches regressions in previously defined scenarios. It <em>cannot</em> find new types of defects, usability issues, or problems in untested areas. Automation <strong>complements</strong> manual and exploratory testing — it does <strong>not</strong> replace them. Acquiring a tool does NOT guarantee success.</p></div>
<div class="info-block yellow"><h3>📌 Exam Tip — Know the Risk List</h3><p>The CTFL exam (K1 level for this section) expects you to <strong>recall</strong> both benefits and risks. Focus on the ones that are non-obvious: vendor dependency, open-source abandonment, regulatory non-compliance, and over-reliance on the tool are the ones most candidates miss.</p></div>`
    },
  ]
},

  { ch:1, q:'A developer makes a mistake that introduces a bug in the code. Using correct ISTQB terminology, the mistake is called a(n):', opts:['A) Failure','B) Defect','C) Error','D) Root Cause'], ans:2, fb:'Error = the human mistake. Defect = the fault introduced into the work product. Failure = the observable bad behavior when the defect is triggered. These are a chain.' },

  { ch:1, q:'After fixing a defect, testing is repeated to verify the fix worked AND to ensure no new defects were introduced elsewhere. The second part is called:', opts:['A) Confirmation testing','B) Exploratory testing','C) Regression testing','D) Acceptance testing'], ans:2, fb:'Confirmation testing = re-run original test to verify the fix. Regression testing = test the rest of the system to ensure the fix didn\'t break something else. Both happen after a fix.' },
