  // Ch2
  { ch:2, q:'Which of the following BEST describes the impact of choosing an Agile SDLC model on testing?', opts:['A) Dynamic testing can be performed early since code is written upfront','B) Lightweight documentation and heavy test automation are favored due to frequent change','C) Test documentation is more formal and detailed than in sequential models','D) Testers only participate in the final iteration for acceptance testing'], ans:1, fb:'Agile assumes change throughout the project. This means lightweight work product documentation and extensive test automation (for regression) are favored. Most manual testing uses experience-based techniques. Testers are involved from Day 1.' },
  { ch:2, q:'In Test-Driven Development (TDD), what is the correct order of activities?', opts:['A) Write code → Write test → Refactor','B) Write test → Write code to pass it → Refactor','C) Analyze requirements → Write code → Write tests','D) Write acceptance criteria → Write tests → Deploy'], ans:1, fb:'TDD follows: Write a FAILING test first → Write the minimum code to make it pass → Refactor both code and tests. The test drives the coding — not the other way around.' },
  { ch:2, q:'Which statement about "shift left" is CORRECT according to the ISTQB syllabus?', opts:['A) Shift left means removing all late-stage testing to save time','B) Shift left means performing testing earlier in the SDLC without neglecting later testing','C) Shift left is only applicable in Agile projects','D) Shift left means moving test execution to the left side of the V-Model diagram'], ans:1, fb:'Shift left = testing earlier in the SDLC. Crucially, it does NOT mean neglecting later testing — all phases still occur. It adds early testing. It is applicable to ALL SDLC models, not just Agile.' },
  { ch:2, q:'What is the PRIMARY purpose of a retrospective in the context of testing?', opts:['A) To formally close all open defects before release','B) To measure code coverage achieved during the iteration','C) To reflect on what worked and what to improve, feeding into continuous improvement','D) To hand over testware to the operations team'], ans:2, fb:'Retrospectives discuss: what succeeded (retain it), what failed (improve it), and how to act on improvements. Results are recorded, typically in the Test Completion Report. They are a key mechanism for continuous process improvement.' },
  { ch:2, q:'A company migrates its system from an on-premise server to a cloud platform. According to ISTQB, what maintenance testing trigger does this represent?', opts:['A) Modification — corrective change','B) Modification — planned enhancement','C) Upgrade or migration of the operational environment','D) Retirement testing'], ans:2, fb:'Moving to a new platform (cloud migration) is an "upgrade or migration of the operational environment." This requires testing the new environment AND the changed software, potentially including data migration testing.' },
  { ch:2, q:'What is the FIRST step a tester should take before performing regression testing after a software change?', opts:['A) Re-run all existing test cases immediately','B) Write new test cases for the changed code','C) Perform impact analysis to identify which parts of the system could be affected','D) Archive the old test scripts and start fresh'], ans:2, fb:'The ISTQB syllabus specifically states: perform IMPACT ANALYSIS before regression testing (ideally before even making the change). Impact analysis identifies which parts could be affected, guiding the scope and depth of regression testing needed.' },
  { ch:2, q:'A system being retired requires its data to be stored for 10 years. What type of maintenance testing is specifically needed?', opts:['A) Corrective maintenance testing','B) Performance testing of the archive system','C) Testing of data archiving and restore/retrieval procedures','D) User acceptance testing of the new replacement system'], ans:2, fb:'The ISTQB syllabus specifically mentions: retirement can require testing of data ARCHIVING (if long retention is needed) AND testing of RESTORE and RETRIEVAL procedures — in case archived data must be accessed during the retention period.' },
  // Ch3
  { ch:3, q:'Which type of review is the MOST FORMAL and typically involves predefined roles, entry/exit criteria, and the author NOT leading the review?', opts:['A) Informal Review','B) Walkthrough','C) Technical Review','D) Inspection'], ans:3, fb:'Inspection is the most formal review type. Key features: defined roles (moderator ≠ author), formal entry/exit criteria, checklists, metrics collected, author does NOT lead.' },
  { ch:3, q:'A requirements document is reviewed by the project team to check for ambiguities and missing information — WITHOUT running any software. This is an example of:', opts:['A) Dynamic testing','B) Black-box testing','C) Static testing','D) Regression testing'], ans:2, fb:'Static testing = examining work products without executing software. Reviewing requirements documents is a classic static testing activity. No code runs.' },
  { ch:3, q:'Which of the following is a benefit UNIQUE to static testing (that dynamic testing cannot provide)?', opts:['A) Finds defects when the code is executed','B) Can detect defects in non-executable artifacts like requirements and designs','C) Measures code coverage','D) Verifies system performance'], ans:1, fb:'Static testing can review requirements, designs, contracts, and plans — things that can\'t be "run." Dynamic testing only works on executable software. This is static testing\'s unique advantage.' },
  // Ch4
  { ch:4, q:'A tester is testing an age input field that only accepts values from 18 to 65. Using 2-value BVA, which set of test values achieves 100% boundary coverage?', opts:['A) 18, 35, 65','B) 17, 18, 65, 66','C) 18, 19, 64, 65','D) 1, 18, 65, 100'], ans:1, fb:'2-value BVA: for each boundary, test the boundary itself AND its closest neighbor in the adjacent partition. Lower boundary 18 → test 17 (invalid, adjacent) and 18. Upper boundary 65 → test 65 and 66 (invalid, adjacent). Result: 17, 18, 65, 66.' },
  { ch:4, q:'A developer coded "if (x = 10)" instead of the correct "if (x ≤ 10)". Which BVA approach would detect this defect?', opts:['A) 2-value BVA only (tests x=10 and x=11)','B) 3-value BVA (adds x=9, which detects the defect)','C) Both 2-value and 3-value BVA would catch it equally','D) Neither BVA approach can detect logical errors like this'], ans:1, fb:'2-value BVA tests x=10 (true in both versions) and x=11 (false in both versions) — the defect is hidden. 3-value BVA adds x=9: the correct condition (x≤10) should be TRUE for x=9, but the buggy code (x=10) returns FALSE. Defect detected!' },
  { ch:4, q:'Which statement about branch coverage and statement coverage is CORRECT according to the ISTQB syllabus?', opts:['A) 100% statement coverage guarantees 100% branch coverage','B) 100% branch coverage guarantees 100% statement coverage','C) They are equivalent — achieving one always achieves the other','D) Branch coverage only applies to white-box testing; statement coverage applies to black-box'], ans:1, fb:'Branch coverage SUBSUMES statement coverage. Achieving 100% branch coverage automatically guarantees 100% statement coverage (because every statement must be in some branch). But NOT vice versa — 100% statement coverage does not guarantee all branches are exercised.' },
  { ch:4, q:'In Equivalence Partitioning, why is testing ONE value from each partition considered sufficient?', opts:['A) Because it saves testing time and budget','B) Because all values in a partition are expected to be processed the same way by the test object','C) Because boundary values at the edges are already handled by BVA','D) Because the ISTQB exam only requires one test per partition'], ans:1, fb:'The core EP assumption: if a test with one value from a partition detects a defect, any other value from that same partition would detect the same defect. Conversely, if one value behaves correctly, all values in the partition behave correctly. One test per partition is sufficient.' },
  { ch:4, q:'A tester is designing tests for a business rules engine that grants discounts based on customer tier (Gold/Silver/Bronze) AND order size (Large/Small). To systematically cover all combinations, which technique is most appropriate?', opts:['A) Boundary Value Analysis','B) State Transition Testing','C) Decision Table Testing','D) Exploratory Testing'], ans:2, fb:'Decision table testing is ideal when outcomes depend on COMBINATIONS of conditions — like customer tier AND order size. It creates a systematic table of all feasible combinations, ensuring no business rule scenario is missed. BVA focuses on boundaries, State Transition on system states, Exploratory on unstructured learning.' },
  { ch:4, q:'A system has states: Locked, Unlocked, and Suspended. Which coverage criterion requires testing BOTH valid transitions AND attempting invalid transitions?', opts:['A) All States Coverage','B) Valid Transitions Coverage (0-switch coverage)','C) All Transitions Coverage','D) Path Coverage'], ans:2, fb:'All Transitions Coverage requires: (1) exercising all VALID transitions, AND (2) attempting to execute all INVALID transitions (empty cells in the state table). This is the most rigorous criterion and the minimum requirement for safety-critical software. Testing only one invalid transition per test case avoids defect masking.' },
  { ch:4, q:'In ATDD, what is the FIRST step before writing any test cases?', opts:['A) Automate the acceptance tests using a BDD framework','B) Write the code so the tests have something to test','C) Conduct a specification workshop where the whole team analyzes and refines the user story and acceptance criteria','D) Perform exploratory testing to learn about the feature'], ans:2, fb:'ATDD step 1: Specification workshop — customers, developers, and testers together analyze, discuss, and write the user story and acceptance criteria. Incompleteness and ambiguities are resolved HERE. Only after the story is clear and agreed upon do you move to writing test cases.' },
  { ch:4, q:'A tester is performing exploratory testing using a session-based approach. What is the purpose of the TEST CHARTER in this approach?', opts:['A) It is a formal test script with predefined steps to follow exactly','B) It contains test objectives that guide the testing during the time-boxed session','C) It documents all defects found during the session','D) It defines the entry and exit criteria for the test level'], ans:1, fb:'In session-based exploratory testing, the test charter contains TEST OBJECTIVES that guide — not prescribe — what the tester explores in the time-boxed session. The tester uses the charter as a compass, not a script. After the session, a debriefing discusses findings with stakeholders.' },
  // Ch5
  { ch:5, q:'A critical bug is found in a feature that only 0.1% of users ever access. It crashes the app completely if triggered. Which correctly describes its severity and priority?', opts:['A) High severity, High priority','B) High severity, Low/Medium priority','C) Low severity, High priority','D) Low severity, Low priority'], ans:1, fb:'Severity = technical impact = High (crashes the app). Priority = business urgency = Low/Medium (almost nobody hits this path). Severity and priority are INDEPENDENT — this is a classic exam scenario.' },
  { ch:5, q:'Which document is typically created AT THE END of a test project or major test phase, summarizing coverage achieved, defects found, and lessons learned?', opts:['A) Test Plan','B) Test Progress Report','C) Test Completion Report','D) Risk Register'], ans:2, fb:'Test Completion Report = end-of-project summary. Test Progress Reports = created DURING testing (regularly). Test Plan = created BEFORE testing. Risk Register = part of the test plan.' },
  { ch:5, q:'In risk-based testing, how should testing effort be distributed?', opts:['A) Equally across all features','B) More effort on low-risk areas to ensure full coverage','C) More effort on high-risk areas first','D) Only on features that have had defects before'], ans:2, fb:'Risk-based testing focuses the MOST effort on areas with highest risk (high likelihood × high impact of failure). This ensures that if we run out of time, we\'ve already tested what matters most.' },
  { ch:5, q:'A team uses Three-Point Estimation with values a=6, m=9, b=18. What is the final estimate (E) and standard deviation (SD)?', opts:['A) E=9, SD=2','B) E=10, SD=2','C) E=11, SD=3','D) E=10, SD=4'], ans:1, fb:'Formula: E = (a + 4×m + b) / 6 = (6 + 36 + 18) / 6 = 60/6 = 10. SD = (b - a) / 6 = (18 - 6) / 6 = 12/6 = 2. So E=10, SD=2 → the estimate is 10 ± 2 person-hours.' },
  { ch:5, q:'Which of the following is a characteristic of the TEST PYRAMID\'s BOTTOM layer?', opts:['A) Few tests, slow execution, broad scope (end-to-end)','B) Many tests, fast execution, high isolation (unit/component level)','C) Medium number of tests at the API/service level','D) Manual-only tests for usability and acceptance'], ans:1, fb:'Bottom of the test pyramid = unit/component tests. Characteristics: MANY tests, fast execution, high isolation (test one thing at a time), cheap. Top layer = few, slow, broad E2E tests. The pyramid shape shows the recommended proportions.' },
  { ch:5, q:'According to the Testing Quadrants model, exploratory testing, usability testing, and user acceptance testing all belong to which quadrant?', opts:['A) Q1 — Technology facing, support the team','B) Q2 — Business facing, support the team','C) Q3 — Business facing, critique the product','D) Q4 — Technology facing, critique the product'], ans:2, fb:'Q3 = Business facing, Critique the product. This quadrant contains: exploratory testing, usability testing, and user acceptance testing. These are user-oriented and often manual. Q4 has smoke tests and non-functional tests (except usability).' },
  { ch:5, q:'A tester must prioritize test cases but discovers that test case #20 (low priority) must execute before test case #5 (high priority) due to a dependency. What should the tester do?', opts:['A) Skip test case #20 and execute #5 first to maintain priority order','B) Execute test case #20 before #5, since dependencies override priority rankings','C) Execute both in parallel to save time','D) Report the dependency as a defect and await resolution'], ans:1, fb:'Dependencies always override the ideal priority order. If a high-priority test depends on a lower-priority one, the lower-priority test MUST run first. Failing to do so would make the high-priority test impossible to execute meaningfully.' },
  { ch:5, q:'In Configuration Management, what is a "baseline" in the context of testing?', opts:['A) The minimum acceptable code coverage percentage','B) The first draft of a test plan before it is approved','C) A configuration item approved for testing that can only be changed through formal change control','D) The set of regression tests run at the start of every iteration'], ans:2, fb:'A baseline is an approved configuration item (e.g., a test environment, a build) that has been formally accepted. It can ONLY be changed through a formal change control process. Previous baselines can be restored to reproduce past test results — this is critical for reproducibility.' },
  // Ch6
  { ch:6, q:'Which of the following BEST describes a potential risk of test automation, as stated in the ISTQB CTFL syllabus?', opts:['A) Automation reduces repetitive manual work','B) A team may choose a tool that is not compatible with their development platform','C) Automated tests provide more consistent execution than manual tests','D) Automation enables earlier defect detection'], ans:1, fb:'A, C, D are BENEFITS of test automation. The risk stated in the syllabus is: the automation tool may not be compatible with the development platform — leaving your test suite unable to run on your actual technology stack.' },
  { ch:6, q:'According to the ISTQB syllabus, which category of test tool "supports the tester in performing reviews and static analysis"?', opts:['A) Test execution tools','B) Non-functional testing tools','C) Static testing tools','D) DevOps tools'], ans:2, fb:'The syllabus explicitly states: Static testing tools support the tester in performing reviews and static analysis. They do NOT execute code — they analyze it. Examples: SonarQube, ESLint, Checkstyle.' },
  { ch:6, q:'A team acquires an expensive test automation tool but sees no improvement after 6 months. According to the ISTQB syllabus, what is the MOST LIKELY root cause?', opts:['A) Automated testing is always less effective than manual testing','B) Simply acquiring a tool does not guarantee success — effort is needed for introduction, maintenance, and training','C) The tool vendor provided poor support','D) The team should have used open-source tools instead'], ans:1, fb:'The ISTQB syllabus opens section 6.2 with this key statement: "Simply acquiring a tool does not guarantee success. Each new tool will require effort to achieve real and lasting benefits — for tool introduction, maintenance and training." Buying the tool is just the first step.' },
  { ch:6, q:'Which of the following is listed as a BENEFIT of test automation in the ISTQB CTFL v4.0.1 syllabus?', opts:['A) Unrealistic expectations about tool functionality','B) Dependency on the tool vendor who may retire the tool','C) More time for testers to design new, deeper, and more effective tests','D) Using a test tool when manual testing is more appropriate'], ans:2, fb:'The syllabus lists "More time for testers to design new, deeper and more effective tests" as a benefit — automation takes over repetitive execution so human testers can focus on creative, complex test design. Options A, B, D are all RISKS.' },
  { ch:6, q:'A company integrates their test execution into an automated CI/CD pipeline that triggers tests on every code commit. According to the ISTQB tool categories, which type of tool primarily enables this pipeline?', opts:['A) Static testing tools','B) Non-functional testing tools','C) Test management tools','D) DevOps tools'], ans:3, fb:'The syllabus defines DevOps tools as those that "support the DevOps delivery pipeline, workflow tracking, automated build processes, CI/CD." A CI/CD pipeline that triggers tests automatically on every commit is a DevOps tool in action. Examples: Jenkins, GitHub Actions, GitLab CI.' },
];

// ─────────────────────────────────────────────
// BUILD SIDEBAR
// ─────────────────────────────────────────────
const sidebar = document.getElementById('sidebar');
const chColors = {'ch1':'#4af0a8','ch2':'#38bdf8','ch3':'#a78bfa','ch4':'#f59e0b','ch5':'#f87171','ch6':'#4af0a8'};

chapters.forEach((ch,ci) => {
  const grp = document.createElement('div');
  grp.className = 'chapter-group';
  const hdr = document.createElement('div');
  hdr.className = 'chapter-header' + (ci===0?' open':'');
  hdr.innerHTML = `<span class="chapter-dot"></span>${ch.title}`;
  const items = document.createElement('div');
  items.className = 'chapter-items' + (ci===0?' open':'');
  ch.sections.forEach((sec,si) => {
    const n = document.createElement('div');
    n.className = 'nav-item' + (ci===0&&si===0?' active':'');
    n.dataset.id = sec.id;
    n.innerHTML = `<span class="num">${sec.num}</span>${sec.title}`;
    n.onclick = () => showSection(sec.id, n);
    items.appendChild(n);
  });
  // Quiz link
  const qn = document.createElement('div');
  qn.className = 'nav-item';
  qn.dataset.id = `quiz_${ch.id}`;
  qn.innerHTML = `<span class="num">✓</span>Chapter Quiz`;
  qn.onclick = () => showSection(`quiz_${ch.id}`, qn);
  items.appendChild(qn);

  hdr.onclick = () => {
    hdr.classList.toggle('open');
    items.classList.toggle('open');
  };
  grp.appendChild(hdr);
  grp.appendChild(items);
  sidebar.appendChild(grp);
});

// ─────────────────────────────────────────────
// BUILD MAIN CONTENT
// ─────────────────────────────────────────────
const mainEl = document.getElementById('main');
const visited = new Set();
let allSectionIds = [];

chapters.forEach((ch,ci) => {
  ch.sections.forEach((sec,si) => {
    allSectionIds.push(sec.id);
    const div = document.createElement('div');
    div.className = 'section' + (ci===0&&si===0?' active':'');
    div.id = sec.id;
    div.innerHTML = sec.content;
    mainEl.appendChild(div);
    if(ci===0&&si===0) visited.add(sec.id);
  });
  // Build quiz section
  const chQuizzes = allQuizzes.filter(q => q.ch === ci+1);
  const qId = `quiz_${ch.id}`;
  allSectionIds.push(qId);
  const qDiv = document.createElement('div');
  qDiv.className = 'section';
  qDiv.id = qId;
  let qHTML = `<div class="section-tag">${ch.title}</div><h2>Chapter Quiz</h2><p class="intro-text">Test your understanding with ISTQB-style questions. Read carefully!</p>`;
  chQuizzes.forEach((quiz,qi) => {
    const qKey = `${qId}_${qi}`;
    qHTML += `<div class="quiz-card" id="qc_${qKey}">
      <div class="quiz-q">Q${qi+1}. ${quiz.q}</div>
      <div class="quiz-options">
        ${quiz.opts.map((o,oi) => `<button class="quiz-opt" onclick="answer('${qKey}',${oi},${quiz.ans},'${quiz.fb.replace(/'/g,"&#39;")}')">${o}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="fb_${qKey}"></div>
    </div>`;
  });
  qDiv.innerHTML = qHTML;
  mainEl.appendChild(qDiv);
});

// Final mega quiz
allSectionIds.push('mega_quiz');
const mqDiv = document.createElement('div');
mqDiv.className = 'section';
mqDiv.id = 'mega_quiz';
let mqHTML = `<div class="section-tag">All Chapters</div><h2>🎓 Final Exam Practice</h2><p class="intro-text">A mixed selection of questions from all 6 chapters. This simulates the real ISTQB exam format.</p>`;
const shuffled = [...allQuizzes].sort(()=>Math.random()-0.5).slice(0,15);
shuffled.forEach((quiz,qi) => {
  const qKey = `mq_${qi}`;
  mqHTML += `<div class="quiz-card" id="qc_${qKey}">
    <div class="quiz-q">Q${qi+1}. ${quiz.q}</div>
    <div class="quiz-options">
      ${quiz.opts.map((o,oi) => `<button class="quiz-opt" onclick="answer('${qKey}',${oi},${quiz.ans},'${quiz.fb.replace(/'/g,"&#39;")}')">${o}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="fb_${qKey}"></div>
  </div>`;
});
mqDiv.innerHTML = mqHTML;
mainEl.appendChild(mqDiv);

// Final quiz nav item
const finalGrp = document.createElement('div');
finalGrp.className = 'chapter-group';
finalGrp.innerHTML = `<div class="nav-item" data-id="mega_quiz" onclick="showSection('mega_quiz',this)" style="padding-left:18px;"><span class="num" style="background:rgba(74,240,168,0.15);color:#4af0a8;">🏆</span>Final Exam Practice</div>`;
sidebar.appendChild(finalGrp);

// ─────────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────────
function showSection(id, navEl) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const target = document.getElementById(id);
  if(target) { target.classList.add('active'); }
  if(navEl) navEl.classList.add('active');
  visited.add(id);
  const pct = Math.min(100, Math.round((visited.size / allSectionIds.length) * 100));
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% complete';
  window.scrollTo({top:0, behavior:'smooth'});
}

const answeredCards = {};
function answer(qKey, chosen, correct, fb) {
  if(answeredCards[qKey]) return;
  answeredCards[qKey] = true;
  const card = document.getElementById(`qc_${qKey}`);
  const btns = card.querySelectorAll('.quiz-opt');
  btns.forEach(b => b.disabled = true);
  btns[chosen].classList.add(chosen === correct ? 'correct' : 'wrong');
  if(chosen !== correct) btns[correct].classList.add('correct');
  const fbEl = document.getElementById(`fb_${qKey}`);
  fbEl.textContent = (chosen === correct ? '✅ ' : '❌ ') + fb;
  fbEl.className = 'quiz-feedback show ' + (chosen === correct ? 'ok' : 'nope');
}
</script>
</body>
</html>
